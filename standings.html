<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Standings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">

  <!-- Apple Touch Icon (For iPhone Home Screen Bookmarks) -->
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <!-- Open Graph / Social Sharing Meta Tags -->
  <meta property="og:title" content="BBBCWSCLP — Season Leaderboard & Standings">
  <meta property="og:description" content="Official standings and leaderboard for Big Boys Betting Club.">
  <meta property="og:image" content="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">
  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; text-align: left; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; text-align: center; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .rank-1 { color: #facc15; font-weight: bold; }
    .rank-2 { color: #cbd5e1; font-weight: bold; }
    .rank-3 { color: #fb923c; font-weight: bold; }

    .msg { text-align: center; color: var(--text-muted); padding: 1.5rem; font-style: italic; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">Leaderboard</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html" class="active">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html" class="active">Scores</a>
    </nav>

    <div class="card">
      <h2>Overall Leaderboard</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>(W-L-D)</th>
              <th>Win %</th>
            </tr>
          </thead>
          <tbody id="standings-tbody">
            <tr><td colspan="4" class="msg">Calculating standings...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadStandings() {
      const tbody = document.getElementById('standings-tbody');

      const { data: players, error: playerErr } = await _supabase
        .from('players')
        .select('*');

      const { data: picks, error: pickErr } = await _supabase
        .from('picks')
        .select('*');

      if (playerErr || pickErr) {
        tbody.innerHTML = `<tr><td colspan="4" class="msg" style="color: var(--danger);">Error loading standings data.</td></tr>`;
        return;
      }

      const stats = {};
      players.forEach(p => {
        stats[p.id] = {
          id: p.id,
          initials: p.initials,
          wins: 0,
          losses: 0,
          draws: 0
        };
      });

      picks.forEach(p => {
        if (!stats[p.player_id]) return;
        if (p.result === 'W') {
          stats[p.player_id].wins += 1;
        } else if (p.result === 'L') {
          stats[p.player_id].losses += 1;
        } else if (p.result === 'D') {
          stats[p.player_id].draws += 1;
        }
      });

      const leaderboard = Object.values(stats).map(s => {
        const totalPoints = s.wins + (s.draws * 0.5);
        const totalDecided = s.wins + s.losses + s.draws;
        const winPct = totalDecided > 0 ? (totalPoints / totalDecided) : 0;
        return {
          ...s,
          totalPoints,
          winPct
        };
      });

      leaderboard.sort((a, b) => {
        if (b.totalPoints !== a.totalPoints) {
          return b.totalPoints - a.totalPoints; 
        }
        if (b.wins !== a.wins) {
          return b.wins - a.wins;
        }
        return b.winPct - a.winPct; 
      });

      tbody.innerHTML = '';

      if (leaderboard.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="msg">No players registered yet.</td></tr>`;
        return;
      }

      leaderboard.forEach((p, index) => {
        const rank = index + 1;
        let rankDisplay = `#${rank}`;
        let rankClass = '';

        if (rank === 1) {
          rankDisplay = '🥇';
          rankClass = 'rank-1';
        } else if (rank === 2) {
          rankDisplay = '🥈';
          rankClass = 'rank-2';
        } else if (rank === 3) {
          rankDisplay = '🥉';
          rankClass = 'rank-3';
        }

        let formattedInitials = p.initials;
        const dsMatchIndex = p.initials.toUpperCase().indexOf('DS');
        if (dsMatchIndex !== -1) {
          const before = p.initials.substring(0, dsMatchIndex);
          const after = p.initials.substring(dsMatchIndex + 2);
          formattedInitials = `${before}<a href="admin.html" style="color: inherit; text-decoration: none;">D</a>S${after}`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="${rankClass}">${rankDisplay}</td>
          <td><strong>${formattedInitials}</strong></td>
          <td>${p.wins}-${p.losses}-${p.draws}</td>
          <td>${(p.winPct * 100).toFixed(1)}%</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadStandings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Hall of Fame</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; flex-wrap: wrap; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Section & Card Styling */
    .section-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); text-align: left; }
    
    /* Featured Legacy Blocks (Top Section Stacked) */
    .featured-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .featured-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.1);
      text-align: left;
    }

    .featured-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold);
      background-color: var(--bg);
      flex-shrink: 0;
    }

    .featured-info h3 {
      font-size: 0.85rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
      font-weight: 800;
    }

    .featured-name {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .featured-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Chronological Champion Blocks Grid */
    .champs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .champ-block {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      text-align: left;
    }

    .champ-year {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      min-width: 60px;
    }

    .champ-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background-color: var(--bg);
      flex-shrink: 0;
    }

    .champ-info h4 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .champ-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">BBBCWSCLP:</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html" class="active">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div id="content-container">
      <div style="color: var(--text-muted);">Loading Hall of Fame...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadHallOfFame() {
      const { data: players } = await _supabase.from('players').select('*');

      const container = document.getElementById('content-container');
      container.innerHTML = '';

      // Helper map to look up player avatars by their database initials key
      const playerAvatarMap = {};
      if (players) {
        players.forEach(p => {
          if (p.initials) {
            playerAvatarMap[p.initials.trim().toLowerCase()] = p.avatar_url;
          }
        });
      }

      // Map display names directly to their database initials
      const nameOverrides = {
        'dylan turner': 'dt',
        'austin turner': 'at',
        'caleb': 'ck',
        'harler': 'ah'
      };

      function getAvatarHTML(displayName, cssClass) {
        const lowerName = displayName.trim().toLowerCase();
        const dbKey = nameOverrides[lowerName] || lowerName;
        
        const avatarUrl = playerAvatarMap[dbKey] || playerAvatarMap[lowerName];
        const initialsText = displayName.split(' ').map(n => n[0]).join('').toUpperCase();
        
        if (avatarUrl) {
          return `<img src="${avatarUrl}" alt="${displayName}" class="${cssClass}">`;
        } else {
          return `<div class="${cssClass}" style="display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--gold);">${initialsText}</div>`;
        }
      }

      let html = '';

      // Top Stacked Featured Blocks
      html += `<div class="featured-stack">`;

      // 1. Reigning Defending Champion (Dylan Turner)
      html += `
        <div class="featured-card">
          ${getAvatarHTML('Dylan Turner', 'featured-avatar')}
          <div class="featured-info">
            <h3>🏆 Reigning & Defending Champion</h3>
            <div class="featured-name">Dylan Turner</div>
            <div class="featured-sub">2025 Season Belt Holder</div>
          </div>
        </div>
      `;

      // 2. Most Wins / All-Time Great (Austin Turner)
      html += `
        <div class="featured-card">
          ${getAvatarHTML('Austin Turner', 'featured-avatar')}
          <div class="featured-info">
            <h3>👑 Most Wins</h3>
            <div class="featured-name">Austin Turner</div>
            <div class="featured-sub">2x Champion (2021 & 2022)</div>
          </div>
        </div>
      `;

      html += `</div>`; // Close featured-stack

      // Chronological Belt History Blocks
      const champions = [
        { year: '2025', name: 'Dylan Turner', role: 'Defending Champion' },
        { year: '2024', name: 'Caleb', role: 'Belt Champion' },
        { year: '2023', name: 'Harler', role: 'Belt Champion' },
        { year: '2022', name: 'Austin Turner', role: 'Belt Champion' },
        { year: '2021', name: 'Austin Turner', role: 'Belt Champion' }
      ];

      html += `<div class="section-title">Championship Belt History</div>`;
      html += `<div class="champs-grid">`;

      champions.forEach(c => {
        html += `
          <div class="champ-block">
            <div class="champ-year">${c.year}</div>
            ${getAvatarHTML(c.name, 'champ-avatar')}
            <div class="champ-info">
              <h4>${c.name}</h4>
              <p>${c.role}</p>
            </div>
          </div>
        `;
      });

      html += `</div>`;

      container.innerHTML = html;
    }

    loadHallOfFame();
  </script>
</body>
</html>

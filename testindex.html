<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Current Week Box Styling */
    .current-week-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem 1.25rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      text-align: center;
    }

    /* Week Section Styling */
    .week-section { text-align: center; }
    .week-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--text); }
    .category-title { font-size: 1.15rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Picks Inline Flow */
    .picks-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.5rem; margin-bottom: 1rem; font-size: 1.1rem; }
    .pick-item { font-weight: 700; }

    /* Result Color Coding */
    .res-W { color: var(--success); }
    .res-L { color: var(--danger); }
    .res-D { color: var(--warning); }
    .res-pending { color: var(--text); }

    /* Gambly Link Button Styling */
    .btn-gambly {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 1.25rem auto 0 auto;
      background-color: var(--accent);
      color: white;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    .btn-gambly:hover {
      background-color: #2563eb;
    }

    /* Upcoming Week Preview Card (Always-On Box) */
    .upcoming-preview-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 2rem;
      text-align: left;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }
    .upcoming-preview-header {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .upcoming-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .upcoming-player { font-weight: 700; color: var(--text); }
    .upcoming-pick { color: var(--text-muted); font-size: 0.85rem; }
    .upcoming-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }
    .upcoming-pending {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1rem 0;
      font-style: italic;
    }

    /* Live Scores / Schedule Container Styling */
    .scores-section {
      margin-top: 2.5rem;
      text-align: left;
      width: 100%;
    }
    .scores-header {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .score-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .team-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .team-row { font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 1rem; }
    .game-status { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-align: right; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">BBBCWSCLP</h1>
    </header>

    <nav>
      <a href="index.html" class="active">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <!-- Current Week Box Container -->
    <div id="content-container">
      <div style="color: var(--text-muted);">Loading active week picks...</div>
    </div>

    <!-- Always-On Upcoming Week / Top 5 Box Container -->
    <div id="upcoming-preview-container"></div>

    <!-- Live Scores & Schedule Section -->
    <div class="scores-section">
      <div class="scores-header">Live Schedule & Scores</div>
      <div id="scores-container">
        <div style="color: var(--text-muted); text-align: center; padding: 1rem;">Loading live scores...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeWeekCache = null;
    let allPicksCache = [];
    let liveScoresCache = [];

    async function initPage() {
      // 1. Fetch active open week from Supabase
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .limit(1);

      if (weeks && weeks.length > 0) {
        activeWeekCache = weeks[0];

        const { data: picks } = await _supabase
          .from('picks')
          .select('*, players(initials)')
          .eq('week_id', activeWeekCache.id)
          .order('created_at', { ascending: true });

        allPicksCache = picks || [];
      }

      // 2. Fetch live scores from ESPN API to cross-reference results and populate schedule
      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300');
        const data = await response.json();
        if (data && data.events) {
          liveScoresCache = data.events;
        }
      } catch (err) {
        console.error('Could not fetch live scores:', err);
      }

      renderCurrentWeek();
      renderUpcomingTop5();
      renderLiveScoresList();
    }

    function renderCurrentWeek() {
      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (!activeWeekCache) {
        container.innerHTML = '<div class="current-week-card" style="color: var(--text-muted);">No open weeks currently active. Check Season History for past weeks.</div>';
        return;
      }

      if (!allPicksCache || allPicksCache.length === 0) {
        container.innerHTML = `
          <div class="current-week-card">
            <div class="week-section">
              <div class="week-title">Week ${activeWeekCache.week_number} Parlay:</div>
              <div style="color: var(--text-muted);">No picks submitted for this week yet.</div>
            </div>
          </div>
        `;
        return;
      }

      const evaluatedPicks = evaluatePicksWithScores(allPicksCache);
      const parlayPicks = evaluatedPicks.filter(p => p.is_parlay === true);
      const otherPicks = evaluatedPicks.filter(p => p.is_parlay !== true);

      let html = `<div class="current-week-card"><div class="week-section">`;
      html += `<div class="week-title">Week ${activeWeekCache.week_number} Parlay:</div>`;

      if (parlayPicks.length > 0) {
        html += `<div class="picks-group">`;
        parlayPicks.forEach(p => {
          const evaluatedResult = p.computedResult || p.result;
          const resClass = evaluatedResult ? `res-${evaluatedResult}` : 'res-pending';
          html += `<div class="pick-item ${resClass}">${p.players?.initials || '??'}: ${p.selection}</div>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="picks-group" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">No consensus parlay picks designated yet.</div>`;
      }

      // --- DYNAMIC STACKED BUTTONS ---
      if (activeWeekCache.slip_link || activeWeekCache.gambly_link) {
        html += `<div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; margin-bottom: 1.5rem; width: 100%; align-items: center;">`;
        
        if (activeWeekCache.slip_link) {
          html += `
            <a href="${activeWeekCache.slip_link}" target="_blank" class="btn-gambly" style="margin: 0; background-color: var(--accent);">
              📲 Open Slip in Courtside
            </a>
          `;
        }
        
        if (activeWeekCache.gambly_link) {
          html += `
            <a href="${activeWeekCache.gambly_link}" target="_blank" class="btn-gambly" style="margin: 0; background-color: #334155; color: var(--text);">
              🎲 Open Gambly Link
            </a>
          `;
        }
        
        html += `</div>`;
      }

      if (otherPicks.length > 0) {
        html += `
          <div class="category-title">Others:</div>
          <div class="picks-group">
        `;
        otherPicks.forEach(p => {
          const evaluatedResult = p.computedResult || p.result;
          const resClass = evaluatedResult ? `res-${evaluatedResult}` : 'res-pending';
          html += `<div class="pick-item ${resClass}">${p.players?.initials || '??'}: ${p.selection}</div>`;
        });
        html += `</div>`;
      }

      html += `</div></div>`;
      container.innerHTML = html;
    }

    // Cross-reference picks with live scoreboard data
    function evaluatePicksWithScores(picks) {
      return picks.map(pick => {
        let computedResult = pick.result || null;
        let computedMargin = 0;

        const sel = (pick.selection || '').toLowerCase();
        
        const matchedEvent = liveScoresCache.find(event => {
          const comp = event.competitions[0];
          const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
          const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
          
          const homeName = (homeTeam.team.shortDisplayName || homeTeam.team.name || '').toLowerCase();
          const awayName = (awayTeam.team.shortDisplayName || awayTeam.team.name || '').toLowerCase();

          return sel.includes(homeName) || sel.includes(awayName);
        });

        if (matchedEvent) {
          const comp = matchedEvent.competitions[0];
          const isFinal = comp.status.type.state === 'post';

          if (isFinal) {
            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
            
            const homeScore = parseInt(homeTeam.score || '0', 10);
            const awayScore = parseInt(awayTeam.score || '0', 10);

            const homeName = (homeTeam.team.shortDisplayName || homeTeam.team.name || '').toLowerCase();
            const isHomePick = sel.includes(homeName);
            const pickedTeamScore = isHomePick ? homeScore : awayScore;
            const oppTeamScore = isHomePick ? awayScore : homeScore;

            let spread = 0;
            const spreadMatch = sel.match(/([+-]?\d+(\.\d+)?)$/);
            if (spreadMatch) {
              spread = parseFloat(spreadMatch[1]);
            }

            const adjustedMargin = (pickedTeamScore + spread) - oppTeamScore;
            computedMargin = adjustedMargin;

            if (adjustedMargin > 0) {
              computedResult = 'W';
            } else if (adjustedMargin < 0) {
              computedResult = 'L';
            } else {
              computedResult = 'D';
            }
          }
        }

        return { ...pick, computedResult, margin: computedMargin };
      });
    }

    // --- UPCOMING WEEK TOP 5 PARLAY LOGIC (Always-On Box) ---
    function renderUpcomingTop5() {
      const previewContainer = document.getElementById('upcoming-preview-container');
      
      let weekLabel = activeWeekCache ? `Week ${activeWeekCache.week_number}` : 'Upcoming Week';
      
      let previewHtml = `
        <div class="upcoming-preview-card">
          <div class="upcoming-preview-header">
            <span>🚀 Upcoming Week Parlay</span>
            <span style="font-size: 0.75rem; color: var(--gold); background: rgba(245,158,11,0.15); padding: 0.2rem 0.5rem; border-radius: 4px;">${weekLabel}</span>
          </div>
      `;

      if (!activeWeekCache || allPicksCache.length === 0) {
        previewHtml += `<div class="upcoming-pending">Results pending until the winners are decided.</div>`;
        previewHtml += `</div>`;
        previewContainer.innerHTML = previewHtml;
        return;
      }

      const evaluatedPicks = evaluatePicksWithScores(allPicksCache);
      const allFinalized = evaluatedPicks.length > 0 && evaluatedPicks.every(p => p.computedResult === 'W' || p.computedResult === 'L' || p.computedResult === 'D');

      if (!allFinalized) {
        previewHtml += `<div class="upcoming-pending">Results pending until the winners are decided.</div>`;
      } else {
        const winners = evaluatedPicks.filter(p => p.computedResult === 'W');
        const losses = evaluatedPicks.filter(p => p.computedResult === 'L');
        const pushes = evaluatedPicks.filter(p => p.computedResult === 'D');

        winners.sort((a, b) => b.margin - a.margin);
        losses.sort((a, b) => b.margin - a.margin);

        let top5 = [];
        if (winners.length >= 5) {
          top5 = winners.slice(0, 5);
        } else {
          top5 = [...winners];
          const needed = 5 - top5.length;
          top5 = top5.concat(losses.slice(0, needed));
          
          if (top5.length < 5) {
            const stillNeeded = 5 - top5.length;
            top5 = top5.concat(pushes.slice(0, stillNeeded));
          }
        }

        previewHtml += `<div class="upcoming-list">`;
        top5.forEach((p, idx) => {
          previewHtml += `
            <div class="upcoming-item">
              <div>
                <span class="upcoming-player">#${idx + 1} ${p.players?.initials || '??'}</span>
                <div class="upcoming-pick">${p.selection}</div>
              </div>
              <div class="upcoming-badge">Result: ${p.computedResult}</div>
            </div>
          `;
        });
        previewHtml += `</div>`;
      }

      previewHtml += `</div>`;
      previewContainer.innerHTML = previewHtml;
    }

    // Render live schedule/scores list below
    function renderLiveScoresList() {
      const scoresContainer = document.getElementById('scores-container');
      if (!liveScoresCache || liveScoresCache.length === 0) {
        scoresContainer.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 1rem;">No live games or schedule found right now.</div>';
        return;
      }

      let html = '';
      liveScoresCache.forEach(event => {
        const comp = event.competitions[0];
        const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
        const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
        
        const homeName = homeTeam.team.shortDisplayName || homeTeam.team.name;
        const awayName = awayTeam.team.shortDisplayName || awayTeam.team.name;
        const homeScore = homeTeam.score || '0';
        const awayScore = awayTeam.score || '0';
        
        const state = comp.status.type.state; // 'pre', 'in', 'post'
        let statusText = comp.status.type.detail; // e.g. "Final", "Halftime", "Thu, 7:00 PM EDT"

        html += `
          <div class="score-card">
            <div class="team-info" style="width: 100%;">
              <div class="team-row">
                <span>${awayName}</span>
                <span>${state !== 'pre' ? awayScore : ''}</span>
              </div>
              <div class="team-row" style="margin-top: 0.25rem;">
                <span>${homeName}</span>
                <span>${state !== 'pre' ? homeScore : ''}</span>
              </div>
            </div>
            <div class="game-status" style="min-width: 100px; padding-left: 1rem; border-left: 1px solid var(--border);">
              ${statusText}
            </div>
          </div>
        `;
      });

      scoresContainer.innerHTML = html;
    }

    initPage();
  </script>
</body>
</html>

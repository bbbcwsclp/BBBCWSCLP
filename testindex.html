<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — FBS Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --gold: #f59e0b;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar - Matched exactly to Season.html */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; flex-wrap: wrap; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Conference Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Game Card Styling (Static & Non-clickable) */
    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      text-align: left;
    }

    .game-header-info { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 0.8rem; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
      margin-bottom: 0.75rem; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-live { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-final { background-color: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    .status-sched { background-color: rgba(59, 130, 246, 0.2); color: #93c5fd; }

    .situation-text {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.75rem;
    }

    .associated-picks {
      font-size: 0.85rem;
      font-weight: 700;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
    }

    .team-line { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-weight: 700; 
      font-size: 1.05rem; 
      margin: 0.6rem 0; 
    }

    .team-details { display: flex; align-items: center; gap: 0.75rem; }
    .team-logo { width: 28px; height: 28px; object-fit: contain; }
    .team-rank { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-right: 0.2rem; }
    .team-score { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .winner { color: var(--gold); }

    .odds-line {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Upcoming Week Preview Card */
    .upcoming-preview-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 2rem;
      text-align: left;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }
    .upcoming-preview-header {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upcoming-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .upcoming-player { font-weight: 700; color: var(--text); }
    .upcoming-pick { color: var(--text-muted); font-size: 0.85rem; }
    .upcoming-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .loading-msg, .error-msg { color: var(--text-muted); padding: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title" id="page-main-title">Scores</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html" class="active">Scores</a>
    </nav>

    <!-- Optional Quick Filter for Major FBS Conferences -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterGames('all', event)">All FBS</button>
      <button class="filter-btn" onclick="filterGames('sec', event)">SEC</button>
      <button class="filter-btn" onclick="filterGames('big10', event)">Big Ten</button>
      <button class="filter-btn" onclick="filterGames('acc', event)">ACC</button>
      <button class="filter-btn" onclick="filterGames('big12', event)">Big 12</button>
    </div>

    <div id="scores-container">
      <div class="loading-msg">Fetching scoreboard and group picks...</div>
    </div>

    <!-- Upcoming Week Projected Top 5 Block (Dynamic) -->
    <div id="upcoming-preview-container"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let rawEvents = [];
    let currentFilter = 'all';
    let activeWeekCache = null;
    let allPicksCache = [];

    async function initScores() {
      // 1. Fetch open week and all picks for association & top 5 projection
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .limit(1);

      if (weeks && weeks.length > 0) {
        activeWeekCache = weeks[0];
        document.getElementById('page-main-title').innerText = `Week ${activeWeekCache.week_number} Scores`;

        const { data: picks } = await _supabase
          .from('picks')
          .select('*, players(initials)')
          .eq('week_id', activeWeekCache.id);

        allPicksCache = picks || [];
      } else {
        document.getElementById('page-main-title').innerText = 'Scores';
      }

      await fetchScores();
      await checkAndRenderUpcomingTop5();
    }

    async function fetchScores() {
      const container = document.getElementById('scores-container');
      const apiURL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300';

      try {
        const response = await fetch(apiURL);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<div class="loading-msg">No games scheduled.</div>';
          return;
        }

        rawEvents = data.events;
        renderGames();

      } catch (err) {
        console.error('Error loading scores:', err);
        container.innerHTML = '<div class="error-msg">Could not load live FBS scores. Please try again later.</div>';
      }
    }

    function filterGames(conf, clickEvent) {
      currentFilter = conf;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (clickEvent && clickEvent.target) {
        clickEvent.target.classList.add('active');
      }
      renderGames();
    }

    function renderGames() {
      const container = document.getElementById('scores-container');
      container.innerHTML = '';

      let filteredEvents = rawEvents;

      // Group/Conference Filtering Logic
      if (currentFilter !== 'all') {
        filteredEvents = rawEvents.filter(event => {
          const comp = event.competitions[0];
          const homeConf = comp.competitors[0]?.team?.conferenceId;
          const awayConf = comp.competitors[1]?.team?.conferenceId;

          if (currentFilter === 'sec') return homeConf === '8' || awayConf === '8';
          if (currentFilter === 'big10') return homeConf === '5' || awayConf === '5';
          if (currentFilter === 'acc') return homeConf === '1' || awayConf === '1';
          if (currentFilter === 'big12') return homeConf === '4' || awayConf === '4';
          return true;
        });
      }

      if (filteredEvents.length === 0) {
        container.innerHTML = '<div class="loading-msg">No games found for this filter.</div>';
        return;
      }

      // Sort criteria: Live ('in') games first, then upcoming ('pre'), then finalized ('post') at the bottom
      filteredEvents.sort((a, b) => {
        const stateA = a.competitions[0].status.type.state;
        const stateB = b.competitions[0].status.type.state;

        const getPriority = (state) => {
          if (state === 'in') return 1;
          if (state === 'pre') return 2;
          if (state === 'post') return 3;
          return 4;
        };

        return getPriority(stateA) - getPriority(stateB);
      });

      filteredEvents.forEach(event => {
        const competition = event.competitions[0];
        const statusType = competition.status.type.state; // 'pre', 'in', 'post'
        const statusDetail = competition.status.type.detail; // e.g. "Final", "3rd 4:12"
        
        const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
        const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

        const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
        const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

        const homeName = homeTeam.team.shortDisplayName || homeTeam.team.name;
        const awayName = awayTeam.team.shortDisplayName || awayTeam.team.name;
        
        const homeLogo = homeTeam.team.logo || '';
        const awayLogo = awayTeam.team.logo || '';
        
        const homeScore = homeTeam.score || '0';
        const awayScore = awayTeam.score || '0';

        // Live Situational Data (Down & Distance, Ball on yard line)
        let situationHTML = '';
        if (statusType === 'in' && competition.situation) {
          const sit = competition.situation;
          if (sit.downText && sit.shortDisplayName) {
            situationHTML = `<span class="situation-text">🏈 ${sit.downText} &bull; ${sit.shortDisplayName}</span>`;
          }
        }

        // Broadcast info
        const broadcast = competition.broadcasts && competition.broadcasts.length > 0 
          ? competition.broadcasts[0].names.join(', ') 
          : '';

        // Odds Info
        const oddsObj = competition.odds && competition.odds.length > 0 ? competition.odds[0] : null;
        const spreadText = oddsObj?.details ? `Spread: ${oddsObj.details}` : '';
        const ouText = oddsObj?.overUnder ? `O/U: ${oddsObj.overUnder}` : '';

        // Status badge logic
        let badgeClass = 'status-sched';
        let statusLabel = statusDetail;
        if (statusType === 'in') {
          badgeClass = 'status-live';
          statusLabel = `LIVE • ${statusDetail}`;
        } else if (statusType === 'post') {
          badgeClass = 'status-final';
          statusLabel = 'FINAL';
        }

        const isHomeWinner = statusType === 'post' && parseInt(homeScore) > parseInt(awayScore);
        const isAwayWinner = statusType === 'post' && parseInt(awayScore) > parseInt(homeScore);

        // Check if any active pick matches this game
        const matchedPicks = allPicksCache.filter(p => {
          const sel = (p.selection || '').toLowerCase();
          return sel.includes(homeTeam.team.name.toLowerCase()) || 
                 sel.includes(homeName.toLowerCase()) || 
                 sel.includes(awayTeam.team.name.toLowerCase()) || 
                 sel.includes(awayName.toLowerCase());
        });

        let picksHtml = '';
        if (matchedPicks.length > 0) {
          picksHtml = `<div class="associated-picks">🎯 Club Pick: ${matchedPicks.map(p => `${p.players?.initials || '??'}: ${p.selection}`).join(' | ')}</div>`;
        }

        // Create card element
        const card = document.createElement('div');
        card.className = 'game-card';

        card.innerHTML = `
          <div class="game-header-info">
            <span class="status-badge ${badgeClass}">${statusLabel}</span>
            ${situationHTML}
            <span>${broadcast ? `📺 ${broadcast}` : ''}</span>
          </div>
          ${picksHtml}
          <div class="team-line">
            <div class="team-details">
              <img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'">
              <span class="${isAwayWinner ? 'winner' : ''}"><span class="team-rank">${awayRank}</span>${awayName}</span>
            </div>
            <span class="team-score ${isAwayWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : awayScore}</span>
          </div>
          <div class="team-line">
            <div class="team-details">
              <img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'">
              <span class="${isHomeWinner ? 'winner' : ''}"><span class="team-rank">${homeRank}</span>${homeName}</span>
            </div>
            <span class="team-score ${isHomeWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : homeScore}</span>
          </div>
          ${(spreadText || ouText) ? `
            <div class="odds-line">
              <span>${spreadText}</span>
              <span>${ouText}</span>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    // --- UPCOMING WEEK TOP 5 PARLAY LOGIC (Evaluates when all picked games are finalized) ---
    async function checkAndRenderUpcomingTop5() {
      const previewContainer = document.getElementById('upcoming-preview-container');
      previewContainer.innerHTML = '';

      if (!activeWeekCache) return;

      const picks = allPicksCache;
      if (!picks || picks.length === 0) return;

      // 1. Check if ALL picks for this week have a finalized result (W, L, or D)
      const allFinalized = picks.every(p => p.result === 'W' || p.result === 'L' || p.result === 'D');

      if (!allFinalized) {
        return;
      }

      // 2. Apply Top 5 Selection Formula:
      // - Primary: Winners (result === 'W')
      // - Tie-breaker for > 5 winners: Widest margin of cover
      // - Fill remaining spots if < 5 winners: Closest losses (smallest negative margin)
      
      const parsedPicks = picks.map(p => {
        let margin = 0;
        const sel = (p.selection || '').toLowerCase();
        const spreadMatch = sel.match(/([+-]?\d+(\.\d+)?)$/);
        if (spreadMatch) {
          margin = parseFloat(spreadMatch[1]);
        }
        return { ...p, margin };
      });

      const winners = parsedPicks.filter(p => p.result === 'W');
      const losses = parsedPicks.filter(p => p.result === 'L');
      const pushes = parsedPicks.filter(p => p.result === 'D');

      winners.sort((a, b) => b.margin - a.margin);
      losses.sort((a, b) => b.margin - a.margin);

      let top5 = [];

      if (winners.length >= 5) {
        top5 = winners.slice(0, 5);
      } else {
        top5 = [...winners];
        const needed = 5 - top5.length;
        top5 = top5.concat(losses.slice(0, needed));
        
        if (top5.length < 5) {
          const stillNeeded = 5 - top5.length;
          top5 = top5.concat(pushes.slice(0, stillNeeded));
        }
      }

      let previewHtml = `
        <div class="upcoming-preview-card">
          <div class="upcoming-preview-header">
            <span>🚀 Projected Upcoming Top 5 Parlay</span>
            <span style="font-size: 0.75rem; color: var(--success); background: rgba(34,197,94,0.15); padding: 0.2rem 0.5rem; border-radius: 4px;">Week ${activeWeekCache.week_number} Finalized</span>
          </div>
          <div class="upcoming-list">
      `;

      top5.forEach((p, idx) => {
        previewHtml += `
          <div class="upcoming-item">
            <div>
              <span class="upcoming-player">#${idx + 1} ${p.players?.initials || '??'}</span>
              <div class="upcoming-pick">${p.selection}</div>
            </div>
            <div class="upcoming-badge">Result: ${p.result}</div>
          </div>
        `;
      });

      previewHtml += `</div></div>`;
      previewContainer.innerHTML = previewHtml;
    }

    initScores();
  </script>
</body>
</html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Weekly</title>

  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1a2638;
      --card-inner: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.35rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.82rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-color: var(--accent);
      background-color: #273548;
    }

    nav a.active { 
      color: white; 
      background-color: var(--accent);
      border-color: var(--accent);
    }

    /* Current Week Card Container */
    .current-week-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem 1.25rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
      text-align: center;
    }

    /* Week Section Styling */
    .week-section { margin-bottom: 0; text-align: center; }
    .week-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--text); letter-spacing: 0.3px; }
    .category-title { font-size: 1.05rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }

    /* Picks Inline Flow */
    .picks-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.5rem; margin-bottom: 1rem; font-size: 1.05rem; }
    .pick-item { font-weight: 700; }

    /* Result Color Coding */
    .res-W { color: var(--success); }
    .res-L { color: var(--danger); }
    .res-D { color: var(--warning); }
    .res-pending { color: var(--text); }

    /* Action Link Button Styling */
    .btn-gambly {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 1.25rem auto 0 auto;
      background-color: var(--accent);
      color: white;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;

<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Weekly</title>

  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e10;
      --card-bg: #14191d;
      --card-inner: #060a0c;
      --text: #eef2f2;
      --text-muted: #7c8a90;
      --border: #223038;

      --success: #34d67a;
      --danger: #ff4d4d;
      --warning: #4fb8ff;

      --accent: #ffb020;
      --gold: #ffb020;

      --font-display: 'Anton', 'Arial Narrow', sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', monospace;
      --font-label: 'Barlow Condensed', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-label);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255, 176, 32, 0.05), transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(20, 25, 29, 0.9), var(--bg) 70%),
        linear-gradient(rgba(34, 48, 56, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 48, 56, 0.18) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      background-position: center top, center top, center top, center top;
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1.main-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1;
    }

    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.35rem; 
      margin-bottom: 2rem; 
      width: 100%; 
    }
    
    nav a { 
      font-family: var(--font-label);
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: transparent;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px 4px 0 0;
      font-weight: 600; 
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-bottom-color: var(--accent);
      background-color: rgba(255, 176, 32, 0.06);
    }

    nav a.active { 
      color: var(--accent); 
      background-color: rgba(255, 176, 32, 0.08);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
    }

    nav a:focus-visible, .btn-gambly:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ticker-wrap {
      width: 100%;
      background-color: var(--card-inner);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 2rem;
      position: relative;
    }
    .ticker-wrap::before, .ticker-wrap::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 24px;
      z-index: 2;
      pointer-events: none;
    }
    .ticker-wrap::before { left: 0; background: linear-gradient(90deg, var(--card-inner), transparent); }
    .ticker-wrap::after { right: 0; background: linear-gradient(270deg, var(--card-inner), transparent); }

    .ticker-track {
      display: flex;
      width: max-content;
      animation-name: ticker-scroll;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .ticker-wrap:hover .ticker-track { animation-play-state: paused; }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .ticker-item {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      padding: 0.55rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-right: 1px solid var(--border);
    }
    .ticker-item .tk-status {
      color: var(--text-muted);
      font-size: 0.7rem;
    }
    .ticker-item.tk-live .tk-status { color: var(--success); }
    .ticker-item .tk-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      display: inline-block;
      animation: tk-pulse 1.4s ease-in-out infinite;
    }

    @keyframes tk-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
      .tk-dot { animation: none; }
    }

    .current-week-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.75rem 1.25rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
      text-align: center;
    }

    .week-section { margin-bottom: 0; text-align: center; }
    .week-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 400;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .category-title {
      font-family: var(--font-label);
      font-size: 1rem;
      font-weight: 700;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Strict 2-Column Grid Layout for Text Picks */
    .picks-group { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 0.9rem 1.5rem; 
      margin-bottom: 1.25rem; 
      width: 100%;
    }
    
    @media (max-width: 480px) {
      .picks-group { grid-template-columns: 1fr; }
    }

    .pick-item {
      font-family: var(--font-label);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      width: 100%;
    }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1a2638;
      --card-inner: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
      text-align: left;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      background-color: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: background-color 0.2s;
      box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .btn-danger {
      background-color: var(--danger);
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }

    #status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.2rem;
    }
    .success-text { color: var(--success); }
    .error-text { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">BBBCWSCLP — Admin</h1>
    </header>

    <div class="card">
      <div class="card-title">Manage Week Status & Links</div>
      
      <div class="form-group">
        <label for="week-number-select">Week Number</label>
        <select id="week-number-select">
          <option value="0">Week 0</option>
          <option value="1">Week 1</option>
          <option value="2">Week 2</option>
          <option value="3">Week 3</option>
          <option value="4">Week 4</option>
          <option value="5">Week 5</option>
          <option value="6">Week 6</option>
          <option value="7">Week 7</option>
          <option value="8">Week 8</option>
          <option value="9">Week 9</option>
          <option value="10">Week 10</option>
          <option value="11">Week 11</option>
          <option value="12">Week 12</option>
        </select>
      </div>

      <div class="form-group">
        <label for="week-status">Status</label>
        <select id="week-status">
          <option value="open">Open (Active Weekly)</option>
          <option value="closed">Closed / Finalized</option>
          <option value="upcoming">Upcoming</option>
        </select>
      </div>

      <div class="form-group">
        <label for="slip-link">Courtside Slip Link</label>
        <input type="text" id="slip-link" placeholder="Paste Courtside slip URL...">
      </div>

      <div class="form-group">
        <label for="gambly-link">Gambly Link</label>
        <input type="text" id="gambly-link" placeholder="Paste Gambly URL...">
      </div>

      <button class="btn" id="save-week-btn">Save Week Settings</button>
    </div>

    <div id="status-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const weekSelect = document.getElementById('week-number-select');
    const statusSelect = document.getElementById('week-status');
    const slipLinkInput = document.getElementById('slip-link');
    const gamblyLinkInput = document.getElementById('gambly-link');
    const saveBtn = document.getElementById('save-week-btn');
    const statusMsg = document.getElementById('status-msg');

    // On load, fetch the open week to set as default, and also listen for dropdown changes
    async function initAdmin() {
      try {
        const { data: openWeeks, error } = await _supabase
          .from('weeks')
          .select('*')
          .eq('status', 'open')
          .limit(1);

        if (!error && openWeeks && openWeeks.length > 0) {
          const openWeek = openWeeks[0];
          weekSelect.value = openWeek.week_number;
          loadWeekDetails(openWeek.week_number);
        } else {
          // Fallback to loading week 1 if no open week exists
          loadWeekDetails(weekSelect.value);
        }
      } catch (err) {
        console.error('Initialization error:', err);
      }
    }

    async function loadWeekDetails(weekNum) {
      statusMsg.textContent = 'Loading week details...';
      statusMsg.className = '';

      const { data, error } = await _supabase
        .from('weeks')
        .select('*')
        .eq('week_number', weekNum)
        .maybeSingle();

      if (error) {
        statusMsg.textContent = 'Error loading week data.';
        statusMsg.className = 'error-text';
        return;
      }

      if (data) {
        statusSelect.value = data.status || 'open';
        slipLinkInput.value = data.slip_link || '';
        gamblyLinkInput.value = data.gambly_link || '';
        statusMsg.textContent = `Loaded existing record for Week ${weekNum}.`;
        statusMsg.className = 'success-text';
      } else {
        statusSelect.value = 'upcoming';
        slipLinkInput.value = '';
        gamblyLinkInput.value = '';
        statusMsg.textContent = `No record found for Week ${weekNum} yet. Saving will create it.`;
        statusMsg.className = '';
      }
    }

    weekSelect.addEventListener('change', (e) => {
      loadWeekDetails(parseInt(e.target.value, 10));
    });

    saveBtn.addEventListener('click', async () => {
      const weekNum = parseInt(weekSelect.value, 10);
      const status = statusSelect.value;
      const slip_link = slipLinkInput.value.trim();
      const gambly_link = gamblyLinkInput.value.trim();

      saveBtn.disabled = true;
      statusMsg.textContent = 'Saving week settings...';
      statusMsg.className = '';

      // Check if record exists
      const { data: existing } = await _supabase
        .from('weeks')
        .select('id')
        .eq('week_number', weekNum)
        .maybeSingle();

      let result;
      if (existing) {
        result = await _supabase
          .from('weeks')
          .update({ status, slip_link, gambly_link })
          .eq('week_number', weekNum);
      } else {
        result = await _supabase
          .from('weeks')
          .insert([{ week_number: weekNum, status, slip_link, gambly_link }]);
      }

      saveBtn.disabled = false;

      if (result.error) {
        statusMsg.textContent = `Error saving: ${result.error.message}`;
        statusMsg.className = 'error-text';
      } else {
        statusMsg.textContent = `Successfully saved settings for Week ${weekNum}!`;
        statusMsg.className = 'success-text';
      }
    });

    // Run on startup
    initAdmin();
  </script>
</body>
</html>

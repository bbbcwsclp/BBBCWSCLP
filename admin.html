<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 800px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.75rem; background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    button { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background-color: #2563eb; }

    .msg { text-align: center; color: var(--text-muted); padding: 1.5rem; font-style: italic; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBBC Admin</h1>
      <p>Management & Controls</p>
    </header>

    <nav>
      <a href="index.html">Weekly Picks</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season History</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>

    <!-- Open / Close Week Card -->
    <div class="card">
      <h2>Manage Active Week Status</h2>
      <div class="form-group">
        <label for="admin-week-select">Select Week</label>
        <input type="number" id="admin-week-select" placeholder="Enter week number (e.g., 1)" min="1">
      </div>
      <div class="form-group">
        <label for="admin-status-select">Set Status</label>
        <select id="admin-status-select">
          <option value="open">Open Week (Accepting Picks)</option>
          <option value="closed">Close Week (Lock Picks)</option>
        </select>
      </div>
      <button onclick="updateWeekStatus()">Update Week Status</button>
      <p id="week-status-msg" style="margin-top: 1rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function updateWeekStatus() {
      const weekNum = parseInt(document.getElementById('admin-week-select').value);
      const statusChoice = document.getElementById('admin-status-select').value;
      const statusMsg = document.getElementById('week-status-msg');

      if (isNaN(weekNum)) {
        statusMsg.style.color = 'var(--danger)';
        statusMsg.textContent = 'Please enter a valid week number.';
        return;
      }

      const isOpen = statusChoice === 'open';

      // Assuming you have a table or mechanism tracking week settings (e.g. 'weeks' table with 'week' and 'is_open')
      // Adjust table name if your database uses a different structure
      const { error } = await _supabase
        .from('weeks')
        .upsert({ week: weekNum, is_open: isOpen }, { onConflict: ['week'] });

      if (error) {
        statusMsg.style.color = 'var(--danger)';
        statusMsg.textContent = `Error updating week: ${error.message}`;
      } else {
        statusMsg.style.color = 'var(--success)';
        statusMsg.textContent = `Week ${weekNum} successfully ${isOpen ? 'opened' : 'closed'}!`;
      }
    }
  </script>
</body>
</html>

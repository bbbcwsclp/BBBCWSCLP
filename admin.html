<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: scroll; /* Keeps layout width consistent */
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.5rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
      max-width: 380px; /* Constrains width so it naturally wraps into two rows */
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-color: var(--accent);
      background-color: #273548;
    }

    nav a.active { 
      color: white; 
      background-color: var(--accent);
      border-color: var(--accent);
    }
    
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 1rem; }
    
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-group input { width: auto; }

    button { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s; width: 100%; }
    button:hover { background-color: #2563eb; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .actions-cell select { width: auto; padding: 0.4rem; font-size: 0.9rem; margin-right: 0.5rem; }
    .delete-btn { width: auto; padding: 0.4rem 0.8rem; font-size: 0.9rem; background-color: var(--danger); }
    .delete-btn:hover { background-color: #dc2626; }
    
    .msg { margin-top: 0.75rem; font-size: 0.9rem; text-align: center; }
    
    .table-header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .table-header-action h2 { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    
    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn-batch { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; background-color: var(--success); }
    .btn-batch:hover { background-color: #16a34a; }
    .btn-autograde { width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; background-color: #d97706; }
    .btn-autograde:hover { background-color: #b45309; }

    /* Week Section Styling */
    .week-section-banner {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      margin: 1.25rem 0 0.5rem 0;
      font-weight: 800;
      font-size: 1rem;
      color: var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBBC Admin Panel</h1>
      <p>Manage Weeks, Picks, and Results</p>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="scores.html">Scores</a>
      <a href="admin.html" class="active">Admin</a>
      <a href="halloffame.html">HOF</a>
    </nav>

    <!-- Create / Manage Week Card -->
    <div class="card">
      <h2>1. Open or Close a Week</h2>
      <form id="week-form">
        <div class="form-group">
          <label for="week-number">Week Number to Create/Update</label>
          <input type="number" id="week-number" required placeholder="e.g. 1">
        </div>
        <div class="form-group">
          <label for="week-status">Week Status</label>
          <select id="week-status">
            <option value="open">Open (Active on Main Page)</option>
            <option value="closed">Closed / Finished</option>
          </select>
        </div>
        <div class="form-group">
          <label for="week-slip-link">Courtside Slip Link URL</label>
          <input type="url" id="week-slip-link" placeholder="https://courtside.app/...">
        </div>
        <div class="form-group">
          <label for="week-gambly-link">Gambly Link URL</label>
          <input type="url" id="week-gambly-link" placeholder="https://gambly.com...">
        </div>
        <button type="submit">Save Week Details</button>
        <div id="week-msg" class="msg"></div>
      </form>
    </div>

    <!-- Add New Pick Card -->
    <div class="card">
      <h2>2. Add a Member Pick</h2>
      <form id="pick-form">
        <div class="form-group">
          <label for="pick-week">Select Week</label>
          <select id="pick-week" required>
            <option value="">Loading weeks...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pick-player">Select Player</label>
          <select id="pick-player" required>
            <option value="">Loading players...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pick-selection">Selection (e.g. Alabama -7.5)</label>
          <input type="text" id="pick-selection" required placeholder="Enter pick details">
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="pick-is-parlay">
          <label for="pick-is-parlay" style="margin-bottom: 0; color: var(--text);">Include in Week's Top Parlay</label>
        </div>
        <button type="submit">Submit Pick</button>
        <div id="pick-msg" class="msg"></div>
      </form>
    </div>

    <!-- Active Week Picks Card -->
    <div class="card">
      <div class="table-header-action">
        <h2>3. Manage & Grade Active Week Picks</h2>
        <div class="btn-row">
          <button class="btn-autograde" onclick="autoGradePicks('active')">⚡ Auto-Grade</button>
          <button class="btn-batch" onclick="saveAllPicks('active')">💾 Save All Active</button>
        </div>
      </div>
      <div id="active-container">
        <div style="color: var(--text-muted); text-align: center; padding: 1rem;">Loading active picks...</div>
      </div>
      <div id="active-msg" class="msg"></div>
    </div>

    <!-- Finalized / Closed Weeks Card -->
    <div class="card">
      <div class="table-header-action">
        <h2>4. Finalized & Closed Week Picks</h2>
        <div class="btn-row">
          <button class="btn-autograde" onclick="autoGradePicks('finalized')">⚡ Auto-Grade</button>
          <button class="btn-batch" onclick="saveAllPicks('finalized')">💾 Save All Closed</button>
        </div>
      </div>
      <div id="finalized-container">
        <div style="color: var(--text-muted); text-align: center; padding: 1rem;">No finalized picks found.</div>
      </div>
      <div id="finalized-msg" class="msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allWeeksCache = [];

    async function initAdmin() {
      await loadDropdowns();
      await loadAdminPicks();
    }

    async function loadDropdowns() {
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .order('week_number', { ascending: false });

      allWeeksCache = weeks || [];

      const weekSelect = document.getElementById('pick-week');
      weekSelect.innerHTML = '<option value="">-- Choose Week --</option>';
      
      let openWeekId = '';

      if (weeks) {
        weeks.forEach(w => {
          if (w.status === 'open') {
            openWeekId = w.id;
          }
          weekSelect.innerHTML += `<option value="${w.id}">Week ${w.week_number} (${w.status})</option>`;
        });
      }

      if (openWeekId) {
        weekSelect.value = openWeekId;
      }

      const playerSelect = document.getElementById('pick-player');
      const { data: players } = await _supabase
        .from('players')
        .select('*')
        .order('initials', { ascending: true });

      playerSelect.innerHTML = '<option value="">-- Choose Player --</option>';
      if (players) {
        players.forEach(p => {
          playerSelect.innerHTML += `<option value="${p.id}">${p.initials}</option>`;
        });
      }
    }

    document.getElementById('week-number').addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      const found = allWeeksCache.find(w => w.week_number === val);
      const slipLinkInput = document.getElementById('week-slip-link');
      const gamblyLinkInput = document.getElementById('week-gambly-link');
      const statusSelect = document.getElementById('week-status');

      if (found) {
        slipLinkInput.value = found.slip_link || '';
        gamblyLinkInput.value = found.gambly_link || '';
        statusSelect.value = found.status || 'open';
      } else {
        slipLinkInput.value = '';
        gamblyLinkInput.value = '';
      }
    });

    document.getElementById('week-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const weekNum = parseInt(document.getElementById('week-number').value);
      const status = document.getElementById('week-status').value;
      const slipLink = document.getElementById('week-slip-link').value.trim();
      const gamblyLink = document.getElementById('week-gambly-link').value.trim();
      const msg = document.getElementById('week-msg');

      const { error } = await _supabase
        .from('weeks')
        .upsert([{ 
          season: 2026, 
          week_number: weekNum, 
          status: status, 
          slip_link: slipLink || null,
          gambly_link: gamblyLink || null 
        }], { onConflict: 'season,week_number' });

      if (error) {
        msg.style.color = 'var(--danger)';
        msg.innerText = `Error: ${error.message}`;
      } else {
        msg.style.color = 'var(--success)';
        msg.innerText = `Week ${weekNum} updated successfully!`;
        document.getElementById('week-number').value = '';
        document.getElementById('week-slip-link').value = '';
        document.getElementById('week-gambly-link').value = '';
        initAdmin();
      }
    });

    document.getElementById('pick-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const weekId = document.getElementById('pick-week').value;
      const playerId = document.getElementById('pick-player').value;
      const selection = document.getElementById('pick-selection').value;
      const isParlay = document.getElementById('pick-is-parlay').checked;
      const msg = document.getElementById('pick-msg');

      const { error } = await _supabase
        .from('picks')
        .insert([{ 
          week_id: weekId, 
          player_id: playerId, 
          selection: selection, 
          is_parlay: isParlay 
        }]);

      if (error) {
        msg.style.color = 'var(--danger)';
        msg.innerText = `Error: ${error.message}`;
      } else {
        msg.style.color = 'var(--success)';
        msg.innerText = `Pick added successfully!`;
        document.getElementById('pick-selection').value = '';
        document.getElementById('pick-is-parlay').checked = false;
        initAdmin();
      }
    });

    async function loadAdminPicks() {
      const { data: picks } = await _supabase
        .from('picks')
        .select('*, weeks(week_number, status), players(initials)')
        .order('created_at', { ascending: false });

      const activeContainer = document.getElementById('active-container');
      const finalizedContainer = document.getElementById('finalized-container');
      
      activeContainer.innerHTML = '';
      finalizedContainer.innerHTML = '';

      if (!picks || picks.length === 0) {
        activeContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 1rem;">No picks found.</div>';
        finalizedContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 1rem;">No finalized picks found.</div>';
        return;
      }

      const activePicks = [];
      const finalizedPicks = [];

      picks.forEach(p => {
        const isClosed = p.weeks?.status === 'closed';
        if (isClosed) finalizedPicks.push(p);
        else activePicks.push(p);
      });

      renderPicksByWeek(activePicks, activeContainer, 'No active picks for open weeks.');
      renderPicksByWeek(finalizedPicks, finalizedContainer, 'No finalized picks found.');
    }

    function renderPicksByWeek(picksArray, containerElement, emptyMessage) {
      if (picksArray.length === 0) {
        containerElement.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 1rem;">${emptyMessage}</div>`;
        return;
      }

      const grouped = {};
      picksArray.forEach(p => {
        const wkNum = p.weeks?.week_number ?? '??';
        if (!grouped[wkNum]) grouped[wkNum] = [];
        grouped[wkNum].push(p);
      });

      const sortedWeeks = Object.keys(grouped).sort((a, b) => b - a);

      sortedWeeks.forEach(wkNum => {
        const weekPicks = grouped[wkNum];

        const banner = document.createElement('div');
        banner.className = 'week-section-banner';
        banner.innerHTML = `<span>Week ${wkNum}</span><span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">${weekPicks.length} Picks</span>`;
        containerElement.appendChild(banner);

        const tableWrapper = document.createElement('div');
        tableWrapper.style.overflowX = 'auto';

        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>Player</th>
              <th>Selection</th>
              <th>Parlay?</th>
              <th>Result</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector('tbody');

        weekPicks.forEach(p => {
          const tr = document.createElement('tr');
          tr.dataset.pickId = p.id;
          tr.innerHTML = `
            <td><strong>${p.players?.initials || '??'}</strong></td>
            <td><input type="text" class="row-selection" value="${p.selection || ''}" style="padding: 0.4rem; font-size: 0.9rem;"></td>
            <td><input type="checkbox" class="row-parlay" ${p.is_parlay ? 'checked' : ''}></td>
            <td>
              <select class="row-result" style="padding: 0.4rem; font-size: 0.9rem;">
                <option value="" ${!p.result ? 'selected' : ''}>Pending</option>
                <option value="W" ${p.result === 'W' ? 'selected' : ''}>Win (W)</option>
                <option value="L" ${p.result === 'L' ? 'selected' : ''}>Loss (L)</option>
                <option value="D" ${p.result === 'D' ? 'selected' : ''}>Push (D)</option>
              </select>
            </td>
            <td class="actions-cell">
              <button class="delete-btn" onclick="deletePick('${p.id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        tableWrapper.appendChild(table);
        containerElement.appendChild(tableWrapper);
      });
    }

    async function autoGradePicks(sectionType) {
      const containerId = sectionType === 'active' ? 'active-container' : 'finalized-container';
      const msgId = sectionType === 'active' ? 'active-msg' : 'finalized-msg';
      const container = document.getElementById(containerId);
      const msgDiv = document.getElementById(msgId);
      const rows = container.querySelectorAll('tr[data-pick-id]');

      if (rows.length === 0) return;

      msgDiv.style.color = 'var(--text-muted)';
      msgDiv.innerText = 'Fetching live scores from ESPN to auto-grade...';

      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300');
        const data = await response.json();

        if (!data.events) {
          msgDiv.style.color = 'var(--danger)';
          msgDiv.innerText = 'Could not retrieve live games from ESPN.';
          return;
        }

        let gradedCount = 0;

        rows.forEach(row => {
          const selectionInput = row.querySelector('.row-selection');
          const resultSelect = row.querySelector('.row-result');
          const selText = selectionInput.value.trim().toLowerCase();

          for (const event of data.events) {
            const comp = event.competitions[0];
            if (comp.status.type.state !== 'post') continue;

            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');

            const homeName = (home.team.shortDisplayName || home.team.name).toLowerCase();
            const awayName = (away.team.shortDisplayName || away.team.name).toLowerCase();
            const homeScore = parseInt(home.score);
            const awayScore = parseInt(away.score);

            let matchedTeam = null;
            let opponentScore = 0;
            let teamScore = 0;

            if (selText.includes(homeName) || selText.includes(home.team.name.toLowerCase())) {
              matchedTeam = 'home';
              teamScore = homeScore;
              opponentScore = awayScore;
            } else if (selText.includes(awayName) || selText.includes(away.team.name.toLowerCase())) {
              matchedTeam = 'away';
              teamScore = awayScore;
              opponentScore = homeScore;
            }

            if (matchedTeam) {
              let spread = 0;
              const spreadMatch = selText.match(/([+-]?\d+(\.\d+)?)$/);
              if (spreadMatch) {
                spread = parseFloat(spreadMatch[1]);
              }

              const adjustedScore = teamScore + spread;
              if (adjustedScore > opponentScore) {
                resultSelect.value = 'W';
                gradedCount++;
              } else if (adjustedScore < opponentScore) {
                resultSelect.value = 'L';
                gradedCount++;
              } else {
                resultSelect.value = 'D';
                gradedCount++;
              }
              break;
            }
          }
        });

        msgDiv.style.color = 'var(--success)';
        msgDiv.innerText = `Auto-graded ${gradedCount} picks! Review changes and click "Save All" to confirm.`;
        setTimeout(() => { msgDiv.innerText = ''; }, 5000);

      } catch (err) {
        console.error('Auto-grade error:', err);
        msgDiv.style.color = 'var(--danger)';
        msgDiv.innerText = 'Error connecting to ESPN score feed.';
      }
    }

    async function saveAllPicks(sectionType) {
      const containerId = sectionType === 'active' ? 'active-container' : 'finalized-container';
      const msgId = sectionType === 'active' ? 'active-msg' : 'finalized-msg';
      const container = document.getElementById(containerId);
      const msgDiv = document.getElementById(msgId);
      const rows = container.querySelectorAll('tr[data-pick-id]');

      if (rows.length === 0) return;

      msgDiv.style.color = 'var(--text-muted)';
      msgDiv.innerText = 'Saving changes...';

      let hasError = false;

      for (const row of rows) {
        const pickId = row.dataset.pickId;
        if (!pickId) continue;

        const selection = row.querySelector('.row-selection').value;
        const isParlay = row.querySelector('.row-parlay').checked;
        const result = row.querySelector('.row-result').value;

        const { error } = await _supabase
          .from('picks')
          .update({ 
            selection: selection, 
            is_parlay: isParlay, 
            result: result || null 
          })
          .eq('id', pickId);

        if (error) {
          hasError = true;
          console.error(`Error updating pick ${pickId}:`, error.message);
        }
      }

      if (hasError) {
        msgDiv.style.color = 'var(--danger)';
        msgDiv.innerText = 'Some picks failed to save. Check console for details.';
      } else {
        msgDiv.style.color = 'var(--success)';
        msgDiv.innerText = 'All changes saved successfully!';
        setTimeout(() => { msgDiv.innerText = ''; }, 3000);
      }
    }

    async function deletePick(pickId) {
      if (!confirm('Are you sure you want to delete this pick?')) return;

      const { error } = await _supabase.from('picks').delete().eq('id', pickId);

      if (error) {
        alert(`Error deleting pick: ${error.message}`);
      } else {
        initAdmin();
      }
    }

    initAdmin();
  </script>
</body>
</html>

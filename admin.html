<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; flex-wrap: wrap; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Card Panels */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
      text-align: left;
    }

    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--gold); }
    
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    button:hover { background-color: #2563eb; }
    
    .btn-secondary { background-color: #334155; margin-top: 0.5rem; }
    .btn-secondary:hover { background-color: #475569; }

    .status-msg { margin-top: 0.75rem; font-size: 0.9rem; font-weight: 600; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">Admin Dashboard</h1>
    </header>

    <nav>
      <a href="index.html">Weekly Picks</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season History</a>
      <a href="halloffame.html">Hall of Fame</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>

    <!-- Active Week Link Manager -->
    <div class="card">
      <h2>Manage Active Week Links</h2>
      <div class="form-group">
        <label for="active-week-select">Select Active Week:</label>
        <select id="active-week-select" onchange="loadWeekDetails()">
          <option value="">Loading weeks...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="slip-link-input">Courtside Slip Link:</label>
        <input type="text" id="slip-link-input" placeholder="https://courtside.app/...">
      </div>

      <div class="form-group">
        <label for="gambly-link-input">Gambly Link (Alternative):</label>
        <input type="text" id="gambly-link-input" placeholder="https://...">
      </div>

      <button onclick="saveWeekLinks()">Save Links to Week</button>
      <div id="link-status" class="status-msg"></div>
    </div>

    <!-- Quick Add Week Panel -->
    <div class="card">
      <h2>Open a New Week</h2>
      <div class="form-group">
        <label for="new-week-num">Week Number:</label>
        <input type="number" id="new-week-num" placeholder="e.g. 1">
      </div>
      <button onclick="createNewWeek()" class="btn-secondary">Initialize New Open Week</button>
      <div id="week-status" class="status-msg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let weeksData = [];

    async function fetchWeeks() {
      const { data, error } = await _supabase
        .from('weeks')
        .select('*')
        .order('week_number', { ascending: false });

      const select = document.getElementById('active-week-select');
      
      if (error || !data) {
        select.innerHTML = '<option value="">Error loading weeks</option>';
        return;
      }

      weeksData = data;
      select.innerHTML = '';

      if (data.length === 0) {
        select.innerHTML = '<option value="">No weeks found. Create one below.</option>';
        return;
      }

      data.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = `Week ${w.week_number} (${w.status})`;
        select.appendChild(opt);
      });

      loadWeekDetails();
    }

    function loadWeekDetails() {
      const selectedId = document.getElementById('active-week-select').value;
      const week = weeksData.find(w => w.id == selectedId);

      if (week) {
        document.getElementById('slip-link-input').value = week.slip_link || '';
        document.getElementById('gambly-link-input').value = week.gambly_link || '';
      }
    }

    async function saveWeekLinks() {
      const selectedId = document.getElementById('active-week-select').value;
      const slipLink = document.getElementById('slip-link-input').value.trim();
      const gamblyLink = document.getElementById('gambly-link-input').value.trim();
      const statusDiv = document.getElementById('link-status');

      if (!selectedId) {
        statusDiv.style.color = 'var(--danger)';
        statusDiv.textContent = 'Please select a week first.';
        return;
      }

      const { error } = await _supabase
        .from('weeks')
        .update({ slip_link: slipLink, gambly_link: gamblyLink })
        .eq('id', selectedId);

      if (error) {
        statusDiv.style.color = 'var(--danger)';
        statusDiv.textContent = 'Error saving links: ' + error.message;
      } else {
        statusDiv.style.color = 'var(--success)';
        statusDiv.textContent = 'Links successfully updated!';
        // Update local cache
        const week = weeksData.find(w => w.id == selectedId);
        if (week) {
          week.slip_link = slipLink;
          week.gambly_link = gamblyLink;
        }
      }
    }

    async function createNewWeek() {
      const weekNum = document.getElementById('new-week-num').value;
      const statusDiv = document.getElementById('week-status');

      if (!weekNum) {
        statusDiv.style.color = 'var(--danger)';
        statusDiv.textContent = 'Please enter a week number.';
        return;
      }

      // Optional: Close out prior open weeks if you only want one active at a time
      await _supabase.from('weeks').update({ status: 'closed' }).eq('status', 'open');

      const { error } = await _supabase
        .from('weeks')
        .insert([{ week_number: parseInt(weekNum), status: 'open' }]);

      if (error) {
        statusDiv.style.color = 'var(--danger)';
        statusDiv.textContent = 'Error creating week: ' + error.message;
      } else {
        statusDiv.style.color = 'var(--success)';
        statusDiv.textContent = `Week ${weekNum} successfully opened!`;
        document.getElementById('new-week-num').value = '';
        fetchWeeks();
      }
    }

    fetchWeeks();
  </script>
</body>
</html>

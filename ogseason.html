<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Season History</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e10;
      --card-bg: #14191d;
      --card-inner: #060a0c;
      --text: #eef2f2;
      --text-muted: #7c8a90;
      --border: #223038;

      --success: #34d67a;
      --danger: #ff6b6b;
      --warning: #4fb8ff;

      --accent: #ffb020;
      --gold: #ffb020;

      --font-display: 'Anton', 'Arial Narrow', sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', monospace;
      --font-label: 'Barlow Condensed', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-label);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255, 176, 32, 0.05), transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(20, 25, 29, 0.9), var(--bg) 70%),
        linear-gradient(rgba(34, 48, 56, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 48, 56, 0.18) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      background-position: center top, center top, center top, center top;
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1.main-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1;
    }

    /* Navigation Bar — broadcast channel tabs */
    nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    nav a {
      font-family: var(--font-label);
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      background-color: transparent;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px 4px 0 0;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--text);
      border-bottom-color: var(--accent);
      background-color: rgba(255, 176, 32, 0.06);
    }

    nav a.active {
      color: var(--accent);
      background-color: rgba(255, 176, 32, 0.08);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
    }

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Section & Card Styling */
    .section-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: var(--text);
      text-align: center;
    }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.6rem; }
    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    .stat-card .stat-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .stat-card .stat-main-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .stat-card .stat-value {
      font-family: var(--font-label);
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      word-break: break-word;
    }
    .stat-card .stat-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.9;
    }

    /* Overall Performance Box */
    .overall-card {
      background: linear-gradient(135deg, #14191d 0%, #0a0e10 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .overall-card h3 {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
    }
    .overall-card .overall-value {
      font-family: var(--font-mono);
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .overall-sub { font-family: var(--font-label); font-size: 0.9rem; color: var(--text-muted); margin-top: 0.3rem; }

    /* Week Jump Nav */
    .week-jump-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }
    .week-jump-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.25rem 0.65rem;
      transition: all 0.15s ease;
    }
    .week-jump-pill:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(255, 176, 32, 0.08);
    }

    /* History Feed */
    .week-history-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid rgba(255, 176, 32, 0.3);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      text-align: center;
      scroll-margin-top: 1rem;
      box-shadow: 0 4px 12px -4px rgba(0,0,0,0.4);
    }
    .week-history-card.week-card-win {
      border-left-color: var(--success);
      background: linear-gradient(135deg, rgba(52, 214, 122, 0.06), var(--card-bg) 55%);
    }
    .week-history-card.week-card-loss {
      border-left-color: var(--danger);
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.06), var(--card-bg) 55%);
    }
    .week-history-card.collapsed-week { display: none; }

    .history-week-header {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .week-summary-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      background: rgba(124, 138, 144, 0.12);
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-transform: none;
    }
    .week-summary-badge.badge-win { background: rgba(52, 214, 122, 0.12); color: var(--success); border-color: rgba(52, 214, 122, 0.3); }
    .week-summary-badge.badge-loss { background: rgba(255, 107, 107, 0.12); color: var(--danger); border-color: rgba(255, 107, 107, 0.3); }

    .history-category {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.9rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .history-category:not(:first-of-type) {
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }

    .history-picks-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    /* Pick chips instead of plain colored text — matches the pill/badge
       language used elsewhere on the site (margin badges, progress pills) */
    .history-pick-item {
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.7rem;
      border-radius: 14px;
    }

    .history-pick-item.res-W { color: var(--success); background: rgba(52, 214, 122, 0.1); border: 1px solid rgba(52, 214, 122, 0.3); }
    .history-pick-item.res-L { color: var(--danger); background: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.3); }
    .history-pick-item.res-D { color: var(--warning); background: rgba(79, 184, 255, 0.1); border: 1px solid rgba(79, 184, 255, 0.3); }
    .history-pick-item.res-pending { color: var(--text); background: rgba(124, 138, 144, 0.08); border: 1px solid var(--border); }

    .btn-toggle-weeks {
      display: block;
      margin: 0.5rem auto 2rem auto;
      background-color: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 1.25rem;
      border-radius: 20px;
      font-family: var(--font-label);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-toggle-weeks:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Skeleton Loading State */
    .skeleton-line, .skeleton-block {
      background: linear-gradient(90deg, var(--card-inner) 25%, rgba(255,255,255,0.07) 50%, var(--card-inner) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s ease-in-out infinite;
      border-radius: 4px;
    }
    .skeleton-line { height: 14px; margin: 0 auto 0.75rem auto; }
    .skeleton-block { height: 90px; border-radius: 8px; }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <div class="eyebrow">Season History</div>
      <h1 class="main-title">Performance</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html" class="active">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div id="content-container">
      <div class="stats-grid">
        <div class="stat-card"><div class="skeleton-line" style="width: 50%; height: 10px; margin-bottom: 0.4rem;"></div><div class="skeleton-line" style="width: 65%; height: 16px;"></div></div>
        <div class="stat-card"><div class="skeleton-line" style="width: 50%; height: 10px; margin-bottom: 0.4rem;"></div><div class="skeleton-line" style="width: 65%; height: 16px;"></div></div>
      </div>
      <div class="skeleton-block" style="margin-bottom: 1.25rem;"></div>
      <div class="skeleton-block" style="margin-bottom: 1.25rem;"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Same alias map used on index.html so a pick typed as "Bama" and one
    // typed as "Alabama" get grouped as the same team here instead of
    // splitting the Best/Worst Bet Team tally across two separate entries.
    const TEAM_ALIASES = {
      'sac': 'sacramento state',
      'jax state': 'jacksonville state',
      'unc': 'north carolina',
      'usc': 'southern cal',
      'tex': 'texas',
      'bama': 'alabama',
      'miss st': 'mississippi state',
      'ms st': 'mississippi state',
      'mississippi st': 'mississippi state'
    };

    function titleCase(str) {
      return str.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase());
    }

    function canonicalizeTeamName(rawTeamName) {
      const lower = rawTeamName.trim().toLowerCase();
      const canonicalLower = TEAM_ALIASES[lower] || lower;
      return titleCase(canonicalLower);
    }

    // Helper function to extract team names properly from pick strings (handling spreads, totals, team totals, and matchups)
    function extractTeamNamesFromSelection(selectionText) {
      if (!selectionText) return [];
      let clean = selectionText.trim();
      
      // Strip common betting terminology modifiers
      clean = clean.replace(/\b(team total|tt)\b/gi, '');
      clean = clean.replace(/\b(over|under)\b/gi, '');
      clean = clean.replace(/\b[ou]\s*[\d\.]+\b/gi, '');
      clean = clean.replace(/[+-]?\d+(\.\d+)?/g, '').trim();

      let rawTeams;
      if (clean.includes('/')) {
        rawTeams = clean.split('/').map(t => t.trim()).filter(Boolean);
      } else {
        rawTeams = clean ? [clean] : [];
      }

      return rawTeams.map(canonicalizeTeamName);
    }

    // Mirrors the same "current week" logic used on index.html: a week
    // explicitly forced status='open' always wins; otherwise the most recent
    // week whose start_date has arrived (and isn't force-closed) is current.
    // Used here purely to compute an accurate display label per week, since
    // the raw status column (usually 'scheduled') doesn't tell you which
    // week is actually live right now.
    async function getCurrentWeekId() {
      const { data: manualWeeks } = await _supabase
        .from('weeks')
        .select('id')
        .eq('status', 'open')
        .limit(1);

      if (manualWeeks && manualWeeks.length > 0) return manualWeeks[0].id;

      const todayStr = new Date().toISOString().slice(0, 10);
      const { data: dateWeeks } = await _supabase
        .from('weeks')
        .select('id')
        .lte('start_date', todayStr)
        .not('status', 'in', '("closed","Closed")')
        .order('start_date', { ascending: false })
        .limit(1);

      if (dateWeeks && dateWeeks.length > 0) return dateWeeks[0].id;

      return null;
    }

    // Labels each week for display: raw 'closed' status always shows CLOSED;
    // the single week resolved as current by getCurrentWeekId() shows ACTIVE;
    // a week whose start_date is still in the future shows UPCOMING; anything
    // else (e.g. a week with no start_date yet) falls back to SCHEDULED.
    function computeWeekDisplayStatus(week, currentWeekId) {
      const rawStatus = (week.status || '').toLowerCase();
      if (rawStatus === 'closed') return 'CLOSED';
      if (week.id === currentWeekId) return 'ACTIVE';
      if (week.start_date) {
        const todayStr = new Date().toISOString().slice(0, 10);
        if (week.start_date > todayStr) return 'UPCOMING';
      }
      return 'SCHEDULED';
    }

    async function loadSeasonHistory() {
      const { data: weeks, error: weeksErr } = await _supabase
        .from('weeks')
        .select('*')
        .order('week_number', { ascending: false });

      const { data: picks, error: picksErr } = await _supabase
        .from('picks')
        .select('*, players(initials)');

      const container = document.getElementById('content-container');

      if (weeksErr || picksErr) {
        console.error('Failed to load season history:', weeksErr || picksErr);
        container.innerHTML = `<div style="color: var(--danger);">Couldn't load season history (connection error). Try refreshing.</div>`;
        return;
      }

      if (!weeks || weeks.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted);">No season history recorded yet.</div>';
        return;
      }

      const currentWeekId = await getCurrentWeekId();

      // Compute Overall Group Stats & Breakdown Metrics
      let totalW = 0;
      let totalL = 0;
      let totalD = 0;

      let spreadW = 0, spreadL = 0, spreadD = 0;
      let ouW = 0, ouL = 0, ouD = 0;

      const teamCorrectCounts = {};
      const teamCorrectDisplay = {};
      const teamLossCounts = {};
      const teamLossDisplay = {};

      let biggestWin = null;
      let biggestLoss = null;

      if (picks) {
        picks.forEach(p => {
          const res = p.result;
          const selection = (p.selection || '').trim();
          const lowerSel = selection.toLowerCase();

          const isOU = /\bover\b/.test(lowerSel) || /\bunder\b/.test(lowerSel) || /\b[ou]\d+(\.\d+)?\b/.test(lowerSel);

          if (res === 'W') {
            totalW++;
            if (isOU) ouW++;
            else spreadW++;

            const teams = extractTeamNamesFromSelection(selection);
            teams.forEach(teamName => {
              const key = teamName.toLowerCase();
              teamCorrectCounts[key] = (teamCorrectCounts[key] || 0) + 1;
              if (!teamCorrectDisplay[key]) teamCorrectDisplay[key] = teamName;
            });

            // Biggest cover/blowout: largest positive margin on a winning pick.
            if (typeof p.margin === 'number' && p.margin !== -999) {
              if (!biggestWin || p.margin > biggestWin.margin) {
                biggestWin = { margin: p.margin, initials: p.players?.initials || '??', selection };
              }
            }
          } else if (res === 'L') {
            totalL++;
            if (isOU) ouL++;
            else spreadL++;

            // Increment loss counts for every team mentioned on this losing ticket
            const teams = extractTeamNamesFromSelection(selection);
            teams.forEach(teamName => {
              const key = teamName.toLowerCase();
              teamLossCounts[key] = (teamLossCounts[key] || 0) + 1;
              if (!teamLossDisplay[key]) teamLossDisplay[key] = teamName;
            });

            // Biggest bad beat: largest negative margin (furthest from covering) on a losing pick.
            if (typeof p.margin === 'number' && p.margin !== -999) {
              if (!biggestLoss || p.margin < biggestLoss.margin) {
                biggestLoss = { margin: p.margin, initials: p.players?.initials || '??', selection };
              }
            }
          } else if (res === 'D') {
            totalD++;
            if (isOU) ouD++;
            else spreadD++;
          }
        });
      }

      const totalDecided = totalW + totalL;
      const groupWinPct = totalDecided > 0 ? ((totalW / totalDecided) * 100).toFixed(1) + '%' : '0.0%';

      // Find top predicted team
      let topTeam = 'None';
      let maxTeamCount = 0;
      for (const [key, count] of Object.entries(teamCorrectCounts)) {
        if (count > maxTeamCount) {
          maxTeamCount = count;
          topTeam = teamCorrectDisplay[key];
        }
      }

      // Find most losing team (Worst Beat Team)
      let worstTeam = 'None';
      let maxLossCount = 0;
      for (const [key, count] of Object.entries(teamLossCounts)) {
        if (count > maxLossCount) {
          maxLossCount = count;
          worstTeam = teamLossDisplay[key];
        }
      }

      // Compute Hot/Cold Streaks
      let hottestPlayers = [];
      let maxHotStreak = 0;

      let coldestPlayers = [];
      let maxColdStreak = 0;

      const allPicksChronological = [...(picks || [])].sort(
        (a, b) => new Date(a.created_at) - new Date(b.created_at)
      );

      const { data: players, error: playersErr } = await _supabase
        .from('players')
        .select('*');

      if (playersErr) {
        console.error('Failed to load players for streak calculation:', playersErr);
      }

      if (players && allPicksChronological) {
        players.forEach(player => {
          const playerPicks = allPicksChronological.filter(p => p.player_id === player.id && p.result);
          if (playerPicks.length === 0) return;

          let currentStreakType = null;
          let currentStreakCount = 0;

          for (let i = playerPicks.length - 1; i >= 0; i--) {
            const res = playerPicks[i].result;
            if (res === 'D') continue;

            if (currentStreakType === null) {
              currentStreakType = res;
              currentStreakCount = 1;
            } else if (res === currentStreakType) {
              currentStreakCount++;
            } else {
              break;
            }
          }

          if (currentStreakType === 'W' && currentStreakCount > 0) {
            if (currentStreakCount > maxHotStreak) {
              maxHotStreak = currentStreakCount;
              hottestPlayers = [{ name: player.initials, streak: currentStreakCount }];
            } else if (currentStreakCount === maxHotStreak) {
              hottestPlayers.push({ name: player.initials, streak: currentStreakCount });
            }
          }

          if (currentStreakType === 'L' && currentStreakCount > 0) {
            if (currentStreakCount > maxColdStreak) {
              maxColdStreak = currentStreakCount;
              coldestPlayers = [{ name: player.initials, streak: currentStreakCount }];
            } else if (currentStreakCount === maxColdStreak) {
              coldestPlayers.push({ name: player.initials, streak: currentStreakCount });
            }
          }
        });
      }

      const hotNames = hottestPlayers.length > 0 ? hottestPlayers.map(p => p.name).join(', ') : 'None';
      const hotSub = hottestPlayers.length > 0 ? `(${maxHotStreak} W)` : '';

      const coldNames = coldestPlayers.length > 0 ? coldestPlayers.map(p => p.name).join(', ') : 'None';
      const coldSub = coldestPlayers.length > 0 ? `(${maxColdStreak} L)` : '';

      const topTeamName = topTeam;
      const topTeamSub = maxTeamCount > 0 ? `(${maxTeamCount}W)` : '';

      const worstTeamName = worstTeam;
      const worstTeamSub = maxLossCount > 0 ? `(${maxLossCount}L)` : '';

      const biggestWinValue = biggestWin ? `${biggestWin.initials}: ${biggestWin.selection}` : 'None';
      const biggestWinSub = biggestWin ? `(+${biggestWin.margin})` : '';

      const biggestLossValue = biggestLoss ? `${biggestLoss.initials}: ${biggestLoss.selection}` : 'None';
      const biggestLossSub = biggestLoss ? `(${biggestLoss.margin})` : '';

      // --- RENDER SELECTION ---
      let html = `<div class="section-title">Team Metrics</div>`;

      // Streak Cards Grid
      html += `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">🔥 Hot Streak</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--success);">${hotNames}</span>
              ${hotSub ? `<span class="stat-sub" style="color: var(--success);">${hotSub}</span>` : ''}
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">❄️ Cold Streak</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--danger);">${coldNames}</span>
              ${coldSub ? `<span class="stat-sub" style="color: var(--danger);">${coldSub}</span>` : ''}
            </div>
          </div>
        </div>
      `;

      // Team Metrics Cards Grid
      html += `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Best Bet Team</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--success);">${topTeamName}</span>
              ${topTeamSub ? `<span class="stat-sub" style="color: var(--success);">${topTeamSub}</span>` : ''}
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Worst Bet Team</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--danger);">${worstTeamName}</span>
              ${worstTeamSub ? `<span class="stat-sub" style="color: var(--danger);">${worstTeamSub}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Spread W-L-D</div>
            <div class="stat-main-row"><span class="stat-value">${spreadW}-${spreadL}-${spreadD}</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">O/U W-L-D</div>
            <div class="stat-main-row"><span class="stat-value">${ouW}-${ouL}-${ouD}</span></div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">🏆 Biggest Cover</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--success); font-size: 0.88rem;">${biggestWinValue}</span>
              ${biggestWinSub ? `<span class="stat-sub" style="color: var(--success);">${biggestWinSub}</span>` : ''}
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">💀 Worst Beat</div>
            <div class="stat-main-row">
              <span class="stat-value" style="color: var(--danger); font-size: 0.88rem;">${biggestLossValue}</span>
              ${biggestLossSub ? `<span class="stat-sub" style="color: var(--danger);">${biggestLossSub}</span>` : ''}
            </div>
          </div>
        </div>
      `;

      // Overall Performance Box
      html += `
        <div class="overall-card">
          <h3>Overall Group Performance</h3>
          <div class="overall-value">${totalW} - ${totalL} - ${totalD}</div>
          <div class="overall-sub">Win Rate: ${groupWinPct}</div>
        </div>
      `;

      // weeksAscending (chronological order) is used below for the jump nav
      const weeksAscending = [...weeks].sort((a, b) => a.week_number - b.week_number);

      html += `<div class="section-title">Week-by-Week Breakdown</div>`;

      // Jump-to-week nav (chronological, left-to-right)
      html += `<div class="week-jump-nav">`;
      weeksAscending.forEach(w => {
        html += `<a href="#week-card-${w.week_number}" class="week-jump-pill">W${w.week_number}</a>`;
      });
      html += `</div>`;

      // Render Past Weeks — only the most recent few are shown expanded by
      // default; older weeks collapse behind a "Show all weeks" toggle so
      // the page doesn't turn into endless scrolling deep into a season.
      const RECENT_WEEKS_SHOWN = 3;

      weeks.forEach((week, idx) => {
        const weekPicks = picks ? picks.filter(p => p.week_id === week.id) : [];
        const parlayPicks = weekPicks.filter(p => p.is_parlay === true);
        const otherPicks = weekPicks.filter(p => p.is_parlay !== true);
        const weekStatus = computeWeekDisplayStatus(week, currentWeekId);

        const decidedWeekPicks = weekPicks.filter(p => ['W', 'L', 'D'].includes(p.result));
        const weekW = decidedWeekPicks.filter(p => p.result === 'W').length;
        const weekL = decidedWeekPicks.filter(p => p.result === 'L').length;
        const weekD = decidedWeekPicks.filter(p => p.result === 'D').length;

        let cardTintClass = '';
        let badgeClass = '';
        if (decidedWeekPicks.length > 0) {
          if (weekL === 0 && weekW > 0) { cardTintClass = 'week-card-win'; badgeClass = 'badge-win'; }
          else if (weekW === 0 && weekL > 0) { cardTintClass = 'week-card-loss'; badgeClass = 'badge-loss'; }
        }

        const isCollapsed = idx >= RECENT_WEEKS_SHOWN;

        html += `
          <div class="week-history-card ${cardTintClass} ${isCollapsed ? 'collapsed-week' : ''}" id="week-card-${week.week_number}">
            <div class="history-week-header">
              <span>🏈 Week ${week.week_number}${weekStatus !== 'CLOSED' ? ` (${weekStatus})` : ''}</span>
              ${decidedWeekPicks.length > 0 ? `<span class="week-summary-badge ${badgeClass}">${weekW}W-${weekL}L-${weekD}D</span>` : ''}
            </div>
        `;

        if (weekPicks.length === 0) {
          html += `<div style="color: var(--text-muted); font-size: 0.95rem; text-align: center;">No picks recorded for this week.</div>`;
        } else {
          if (parlayPicks.length > 0) {
            html += `<div class="history-category">Parlay</div><div class="history-picks-list">`;
            parlayPicks.forEach(p => {
              const resClass = p.result ? `res-${p.result}` : 'res-pending';
              html += `<div class="history-pick-item ${resClass}"><strong>${p.players?.initials || '??'}:</strong>&nbsp;${p.selection}</div>`;
            });
            html += `</div>`;
          }

          if (otherPicks.length > 0) {
            html += `<div class="history-category">Others</div><div class="history-picks-list">`;
            otherPicks.forEach(p => {
              const resClass = p.result ? `res-${p.result}` : 'res-pending';
              html += `<div class="history-pick-item ${resClass}"><strong>${p.players?.initials || '??'}:</strong>&nbsp;${p.selection}</div>`;
            });
            html += `</div>`;
          }
        }

        html += `</div>`;
      });

      if (weeks.length > RECENT_WEEKS_SHOWN) {
        html += `<button id="toggle-weeks-btn" class="btn-toggle-weeks">Show All ${weeks.length} Weeks</button>`;
      }

      container.innerHTML = html;

      const toggleBtn = document.getElementById('toggle-weeks-btn');
      if (toggleBtn) {
        let expanded = false;
        toggleBtn.addEventListener('click', () => {
          expanded = !expanded;
          document.querySelectorAll('.collapsed-week').forEach(el => {
            el.style.display = expanded ? 'block' : 'none';
          });
          toggleBtn.textContent = expanded ? 'Show Recent Only' : `Show All ${weeks.length} Weeks`;
        });
      }
    }

    loadSeasonHistory();
  </script>
</body>
</html>

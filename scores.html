<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Live Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --gold: #f59e0b;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 80px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; flex-wrap: wrap; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Score Card Styling */
    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      text-align: left;
    }

    .game-header-info { 
      display: flex; 
      justify-content: space-between; 
      font-size: 0.8rem; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
      margin-bottom: 0.75rem; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    .team-line { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-weight: 700; 
      font-size: 1.05rem; 
      margin: 0.5rem 0; 
    }

    .team-details { display: flex; align-items: center; gap: 0.75rem; }
    .team-logo { width: 24px; height: 24px; object-fit: contain; }
    .team-score { font-size: 1.2rem; font-weight: 800; color: var(--text); }
    .winner { color: var(--gold); }

    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-live { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-final { background-color: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    .status-sched { background-color: rgba(59, 130, 246, 0.2); color: #93c5fd; }

    .loading-msg, .error-msg { color: var(--text-muted); padding: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">Live Scores</h1>
    </header>

    <nav>
      <a href="index.html">Weekly Picks</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season History</a>
      <a href="halloffame.html">Hall of Fame</a>
      <a href="scores.html" class="active">Scores</a>
      <a href="admin.html">Admin</a>
    </nav>

    <div id="scores-container">
      <div class="loading-msg">Fetching latest matchup data...</div>
    </div>
  </div>

  <script>
    async function fetchScores() {
      const container = document.getElementById('scores-container');
      
      // ESPN API endpoint for college football 
      // (You can swap 'college-football' to 'nfl' easily if needed)
      const apiURL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard';

      try {
        const response = await fetch(apiURL);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<div class="loading-msg">No games scheduled for today/this week.</div>';
          return;
        }

        container.innerHTML = '';

        data.events.forEach(event => {
          const competition = event.competitions[0];
          const statusType = competition.status.type.state; // 'pre', 'in', 'post'
          const statusDetail = competition.status.type.detail; // e.g. "Final", "3rd Quarter", "Sat, 7:00 PM"
          
          const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
          const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

          const homeName = homeTeam.team.shortDisplayName || homeTeam.team.name;
          const awayName = awayTeam.team.shortDisplayName || awayTeam.team.name;
          
          const homeLogo = homeTeam.team.logo || '';
          const awayLogo = awayTeam.team.logo || '';
          
          const homeScore = homeTeam.score || '0';
          const awayScore = awayTeam.score || '0';

          // Determine status label styling
          let badgeClass = 'status-sched';
          let statusLabel = statusDetail;
          if (statusType === 'in') {
            badgeClass = 'status-live';
            statusLabel = `LIVE • ${statusDetail}`;
          } else if (statusType === 'post') {
            badgeClass = 'status-final';
            statusLabel = 'FINAL';
          }

          // Build card markup
          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <div class="game-header-info">
              <span class="status-badge ${badgeClass}">${statusLabel}</span>
              <span>${competition.venue ? competition.venue.fullName : ''}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${statusType === 'post' && parseInt(awayScore) > parseInt(homeScore) ? 'winner' : ''}">${awayName}</span>
              </div>
              <span class="team-score ${statusType === 'post' && parseInt(awayScore) > parseInt(homeScore) ? 'winner' : ''}">${statusType === 'pre' ? '-' : awayScore}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${statusType === 'post' && parseInt(homeScore) > parseInt(awayScore) ? 'winner' : ''}">${homeName}</span>
              </div>
              <span class="team-score ${statusType === 'post' && parseInt(homeScore) > parseInt(awayScore) ? 'winner' : ''}">${statusType === 'pre' ? '-' : homeScore}</span>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error('Error loading scores:', err);
        container.innerHTML = '<div class="error-msg">Could not load live scores at the moment. Please check back later.</div>';
      }
    }

    fetchScores();
  </script>
</body>
</html>

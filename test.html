<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Weekly Picks</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 5rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 680px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); letter-spacing: -0.025em; }
    header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }

    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.5rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
      max-width: 380px; 
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { color: var(--text); border-color: var(--accent); background-color: #273548; }
    nav a.active { color: white; background-color: var(--accent); border-color: var(--accent); }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .external-links { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .external-btn { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 0.5rem; 
      background: #1e293b; 
      border: 1px solid var(--border); 
      padding: 0.75rem; 
      border-radius: 8px; 
      color: var(--text); 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .external-btn:hover { background: #273548; border-color: var(--accent); }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }

    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-win { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-loss { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .badge-draw { background: rgba(245, 158, 11, 0.15); color: var(--gold); }
    .badge-pending { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    .parlay-card { border-left: 4px solid var(--gold); background: linear-gradient(135deg, #1e293b 0%, #172033 100%); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Big Boys Betting Club</h1>
      <p id="subtitle-week">Loading current week...</p>
    </header>

    <nav>
      <a href="index.html" class="active">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="scores.html">Scores</a>
      <a href="admin.html">Admin</a>
      <a href="halloffame.html">HOF</a>
    </nav>

    <div id="links-container" class="external-links" style="display: none;">
      <a id="link-courtside" href="#" target="_blank" class="external-btn">🎟️ Courtside Slip</a>
      <a id="link-gambly" href="#" target="_blank" class="external-btn">📊 Gambly View</a>
    </div>

    <!-- Top Parlay Card -->
    <div class="card parlay-card" id="parlay-section" style="display: none;">
      <h2><span>⭐ Week's Top Parlay</span></h2>
      <div id="parlay-list"></div>
    </div>

    <!-- All Member Picks Card -->
    <div class="card">
      <h2><span>📋 Member Selections</span></h2>
      <div style="overflow-x: auto;">
        <table id="picks-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>Selection</th>
              <th style="text-align: right;">Result</th>
            </tr>
          </thead>
          <tbody id="picks-tbody">
            <tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">Loading picks...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadActiveWeek() {
      // Find open week, or fallback to the latest week
      let { data: week } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .single();

      if (!week) {
        const { data: latest } = await _supabase
          .from('weeks')
          .select('*')
          .order('week_number', { ascending: false })
          .limit(1);
        if (latest && latest.length > 0) week = latest[0];
      }

      if (!week) {
        document.getElementById('subtitle-week').innerText = 'No active weeks found.';
        return;
      }

      document.getElementById('subtitle-week').innerText = `2026 Season — Week ${week.week_number} Picks`;

      // Render external links if available
      const linksContainer = document.getElementById('links-container');
      if (week.slip_link || week.gambly_link) {
        linksContainer.style.display = 'grid';
        if (week.slip_link) document.getElementById('link-courtside').href = week.slip_link;
        else document.getElementById('link-courtside').style.display = 'none';

        if (week.gambly_link) document.getElementById('link-gambly').href = week.gambly_link;
        else document.getElementById('link-gambly').style.display = 'none';
      }

      // Load picks for this week
      const { data: picks } = await _supabase
        .from('picks')
        .select('*, players(initials)')
        .eq('week_id', week.id);

      const tbody = document.getElementById('picks-tbody');
      const parlayList = document.getElementById('parlay-list');
      const parlaySection = document.getElementById('parlay-section');

      tbody.innerHTML = '';

      if (!picks || picks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">No picks recorded for this week yet.</td></tr>';
        return;
      }

      let parlayHtml = '';
      let parlayCount = 0;

      picks.forEach(p => {
        const initials = p.players?.initials || '??';
        const selection = p.selection || '';
        const res = p.result;
        
        let badgeClass = 'badge-pending';
        let badgeText = 'Pending';
        if (res === 'W') { badgeClass = 'badge-win'; badgeText = 'Win'; }
        else if (res === 'L') { badgeClass = 'badge-loss'; badgeText = 'Loss'; }
        else if (res === 'D') { badgeClass = 'badge-draw'; badgeText = 'Push'; }

        // Table Row
        tbody.innerHTML += `
          <tr>
            <td><strong>${initials}</strong></td>
            <td>${selection}</td>
            <td style="text-align: right;"><span class="badge ${badgeClass}">${badgeText}</span></td>
          </tr>
        `;

        // Parlay Check
        if (p.is_parlay) {
          parlayCount++;
          parlayHtml += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border);">
              <div><strong>${initials}:</strong> ${selection}</div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
          `;
        }
      });

      if (parlayCount > 0) {
        parlaySection.style.display = 'block';
        parlayList.innerHTML = parlayHtml;
      }
    }

    loadActiveWeek();
  </script>
</body>
</html>

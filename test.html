<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Standings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 5rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 680px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); letter-spacing: -0.025em; }
    header p { color: var(--text-muted); margin-top: 0.3rem; font-size: 0.95rem; }

    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.5rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
      max-width: 380px; 
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { color: var(--text); border-color: var(--accent); background-color: #273548; }
    nav a.active { color: white; background-color: var(--accent); border-color: var(--accent); }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }

    .rank-num { font-weight: 800; color: var(--text-muted); width: 25px; display: inline-block; }
    .leader-1 { color: var(--gold); }
    .leader-2 { color: #e2e8f0; }
    .leader-3 { color: #b45309; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Club Standings</h1>
      <p>2026 Regular Season Leaderboard</p>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html" class="active">Standings</a>
      <a href="season.html">Season</a>
      <a href="scores.html">Scores</a>
      <a href="admin.html">Admin</a>
      <a href="halloffame.html">HOF</a>
    </nav>

    <div class="card">
      <h2>🏆 Cumulative Leaderboard</h2>
      <div style="overflow-x: auto;">
        <table id="standings-table">
          <thead>
            <tr>
              <th style="width: 10%;">Rank</th>
              <th style="width: 30%;">Player</th>
              <th style="width: 30%;">Record (W-L-D)</th>
              <th style="width: 30%; text-align: right;">Win %</th>
            </tr>
          </thead>
          <tbody id="standings-tbody">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">Calculating standings...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadStandings() {
      // Fetch players and all graded picks
      const [{ data: players }, { data: picks }] = await Promise.all([
        _supabase.from('players').select('*'),
        _supabase.from('picks').select('player_id, result')
      ]);

      const tbody = document.getElementById('standings-tbody');
      tbody.innerHTML = '';

      if (!players || players.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">No players found.</td></tr>';
        return;
      }

      // Aggregate records per player
      const statsMap = {};
      players.forEach(p => {
        statsMap[p.id] = { initials: p.initials, wins: 0, losses: 0, draws: 0 };
      });

      if (picks) {
        picks.forEach(p => {
          if (statsMap[p.player_id]) {
            if (p.result === 'W') statsMap[p.player_id].wins++;
            else if (p.result === 'L') statsMap[p.player_id].losses++;
            else if (p.result === 'D') statsMap[p.player_id].draws++;
          }
        });
      }

      const standingsArray = Object.values(statsMap).map(s => {
        const totalDecided = s.wins + s.losses;
        const pct = totalDecided > 0 ? (s.wins / totalDecided) : 0;
        return { ...s, totalDecided, pct };
      });

      // Sort by Win % descending, then Total Wins descending
      standingsArray.sort((a, b) => {
        if (b.pct !== a.pct) return b.pct - a.pct;
        return b.wins - a.wins;
      });

      standingsArray.forEach((s, index) => {
        const rank = index + 1;
        let rankClass = '';
        if (rank === 1) rankClass = 'leader-1';
        else if (rank === 2) rankClass = 'leader-2';
        else if (rank === 3) rankClass = 'leader-3';

        const pctStr = (s.pct * 100).toFixed(1) + '%';

        tbody.innerHTML += `
          <tr>
            <td><span class="rank-num ${rankClass}">#${rank}</span></td>
            <td><strong>${s.initials}</strong></td>
            <td>${s.wins}-${s.losses}-${s.draws}</td>
            <td style="text-align: right; font-weight: 700; color: var(--success);">${pctStr}</td>
          </tr>
        `;
      });
    }

    loadStandings();
  </script>
</body>
</html>

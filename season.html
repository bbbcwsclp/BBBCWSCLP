<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Season History</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.35rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.82rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-color: var(--accent);
      background-color: #273548;
    }

    nav a.active { 
      color: white; 
      background-color: var(--accent);
      border-color: var(--accent);
    }

    /* Section & Card Styling */
    .section-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 1rem; color: var(--text); text-align: center; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 0.75rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 110px;
    }
    .stat-card h3 { 
      font-size: 0.8rem; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      margin-bottom: 0.4rem; 
      white-space: nowrap;
    }
    .stat-card .stat-value { 
      font-size: 1.15rem; 
      font-weight: 800; 
      color: var(--text); 
      line-height: 1.2;
      word-break: break-word;
    }
    .stat-card .stat-sub {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Overall Performance Box */
    .overall-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .overall-card h3 { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
    .overall-card .overall-value { font-size: 1.75rem; font-weight: 900; letter-spacing: 0.5px; color: var(--text); }
    .overall-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* History Feed */
    .week-history-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .history-week-header { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--text); display: flex; justify-content: space-between; align-items: center; }

    .history-category { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 0.75rem; margin-bottom: 0.4rem; text-align: center; }
    .history-picks-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.25rem; font-size: 1rem; }

    /* Result Color Coding */
    .res-W { color: var(--success); }
    .res-L { color: var(--danger); }
    .res-D { color: var(--warning); }
    .res-pending { color: var(--text); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">Performance</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html" class="active">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div id="content-container">
      <div style="color: var(--text-muted);">Loading season history...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSeasonHistory() {
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .order('week_number', { ascending: false });

      const { data: picks } = await _supabase
        .from('picks')
        .select('*, players(initials)');

      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (!weeks || weeks.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted);">No season history recorded yet.</div>';
        return;
      }

      // Compute Overall Group Stats & Breakdown Metrics
      let totalW = 0;
      let totalL = 0;
      let totalD = 0;

      let spreadW = 0, spreadL = 0, spreadD = 0;
      let ouW = 0, ouL = 0, ouD = 0;
      const teamCorrectCounts = {};
      const teamLossCounts = {};

      if (picks) {
        picks.forEach(p => {
          const res = p.result;
          const selection = (p.selection || '').trim();
          const lowerSel = selection.toLowerCase();
          
          const isOU = /\bover\b/.test(lowerSel) || /\bunder\b/.test(lowerSel) || /\b[ou]\d+(\.\d+)?\b/.test(lowerSel);

          if (res === 'W') {
            totalW++;
            if (isOU) ouW++;
            else spreadW++;

            if (!isOU) {
              const cleanTeam = selection.replace(/[+-]?\d+(\.\d+)?/g, '').trim();
              if (cleanTeam) {
                teamCorrectCounts[cleanTeam] = (teamCorrectCounts[cleanTeam] || 0) + 1;
              }
            }
          } else if (res === 'L') {
            totalL++;
            if (isOU) ouL++;
            else spreadL++;

            if (!isOU) {
              const cleanTeam = selection.replace(/[+-]?\d+(\.\d+)?/g, '').trim();
              if (cleanTeam) {
                teamLossCounts[cleanTeam] = (teamLossCounts[cleanTeam] || 0) + 1;
              }
            }
          } else if (res === 'D') {
            totalD++;
            if (isOU) ouD++;
            else spreadD++;
          }
        });
      }

      const totalDecided = totalW + totalL;
      const groupWinPct = totalDecided > 0 ? ((totalW / totalDecided) * 100).toFixed(1) + '%' : '0.0%';

      // Find top predicted team
      let topTeam = 'None';
      let maxTeamCount = 0;
      for (const [team, count] of Object.entries(teamCorrectCounts)) {
        if (count > maxTeamCount) {
          maxTeamCount = count;
          topTeam = team;
        }
      }

      // Find most losing team
      let worstTeam = 'None';
      let maxLossCount = 0;
      for (const [team, count] of Object.entries(teamLossCounts)) {
        if (count > maxLossCount) {
          maxLossCount = count;
          worstTeam = team;
        }
      }

      // Compute Hot/Cold Streaks
      let hottestPlayers = [];
      let maxHotStreak = 0;

      let coldestPlayers = [];
      let maxColdStreak = 0;

      const { data: allPicksChronological } = await _supabase
        .from('picks')
        .select('*, players(initials)')
        .order('created_at', { ascending: true });

      const { data: players } = await _supabase
        .from('players')
        .select('*');

      if (players && allPicksChronological) {
        players.forEach(player => {
          const playerPicks = allPicksChronological.filter(p => p.player_id === player.id && p.result);
          if (playerPicks.length === 0) return;

          let currentStreakType = null;
          let currentStreakCount = 0;

          for (let i = playerPicks.length - 1; i >= 0; i--) {
            const res = playerPicks[i].result;
            if (res === 'D') continue;

            if (currentStreakType === null) {
              currentStreakType = res;
              currentStreakCount = 1;
            } else if (res === currentStreakType) {
              currentStreakCount++;
            } else {
              break;
            }
          }

          if (currentStreakType === 'W' && currentStreakCount > 0) {
            if (currentStreakCount > maxHotStreak) {
              maxHotStreak = currentStreakCount;
              hottestPlayers = [{ name: player.initials, streak: currentStreakCount }];
            } else if (currentStreakCount === maxHotStreak) {
              hottestPlayers.push({ name: player.initials, streak: currentStreakCount });
            }
          }

          if (currentStreakType === 'L' && currentStreakCount > 0) {
            if (currentStreakCount > maxColdStreak) {
              maxColdStreak = currentStreakCount;
              coldestPlayers = [{ name: player.initials, streak: currentStreakCount }];
            } else if (currentStreakCount === maxColdStreak) {
              coldestPlayers.push({ name: player.initials, streak: currentStreakCount });
            }
          }
        });
      }

      const hotNames = hottestPlayers.length > 0 ? hottestPlayers.map(p => p.name).join(', ') : 'None';
      const hotSub = hottestPlayers.length > 0 ? `(${maxHotStreak} W)` : '';

      const coldNames = coldestPlayers.length > 0 ? coldestPlayers.map(p => p.name).join(', ') : 'None';
      const coldSub = coldestPlayers.length > 0 ? `(${maxColdStreak} L)` : '';

      const topTeamName = topTeam;
      const topTeamSub = maxTeamCount > 0 ? `(${maxTeamCount}W)` : '';

      const worstTeamName = worstTeam;
      const worstTeamSub = maxLossCount > 0 ? `(${maxLossCount}L)` : '';

      // --- RENDER SELECTION ---
      let html = `<div class="section-title">Team Metrics</div>`;
      
      // Streak Cards Grid
      html += `
        <div class="stats-grid">
          <div class="stat-card">
            <h3>🔥 Hot Streak</h3>
            <div class="stat-value">${hotNames}</div>
            ${hotSub ? `<div class="stat-sub">${hotSub}</div>` : ''}
          </div>
          <div class="stat-card">
            <h3>❄️ Cold Streak</h3>
            <div class="stat-value">${coldNames}</div>
            ${coldSub ? `<div class="stat-sub">${coldSub}</div>` : ''}
          </div>
        </div>
      `;

      // Team Metrics Cards Grid
      html += `
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Best Bet Team</h3>
            <div class="stat-value">${topTeamName}</div>
            ${topTeamSub ? `<div class="stat-sub">${topTeamSub}</div>` : ''}
          </div>
          <div class="stat-card">
            <h3>Worst Bet Team</h3>
            <div class="stat-value" style="color: var(--danger);">${worstTeamName}</div>
            ${worstTeamSub ? `<div class="stat-sub" style="color: var(--danger);">${worstTeamSub}</div>` : ''}
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Spread W-L-D</h3>
            <div class="stat-value">${spreadW}-${spreadL}-${spreadD}</div>
          </div>
          <div class="stat-card">
            <h3>O/U W-L-D</h3>
            <div class="stat-value">${ouW}-${ouL}-${ouD}</div>
          </div>
        </div>
      `;

      // Overall Performance Box
      html += `
        <div class="overall-card" style="margin-top: 0.5rem;">
          <h3>Overall Group Performance</h3>
          <div class="overall-value">${totalW} - ${totalL} - ${totalD}</div>
          <div class="overall-sub">Win Rate: ${groupWinPct}</div>
        </div>
      `;

      html += `<div class="section-title" style="margin-top: 1.5rem;">Week-by-Week Breakdown</div>`;

      // Render Past Weeks
      weeks.forEach(week => {
        const weekPicks = picks ? picks.filter(p => p.week_id === week.id) : [];
        const parlayPicks = weekPicks.filter(p => p.is_parlay === true);
        const otherPicks = weekPicks.filter(p => p.is_parlay !== true);

        html += `
          <div class="week-history-card">
            <div class="history-week-header" style="justify-content: center;">
              <span>Week ${week.week_number} (${week.status.toUpperCase()})</span>
            </div>
        `;

        if (weekPicks.length === 0) {
          html += `<div style="color: var(--text-muted); font-size: 0.95rem; text-align: center;">No picks recorded for this week.</div>`;
        } else {
          if (parlayPicks.length > 0) {
            html += `<div class="history-category">Parlay:</div><div class="history-picks-list">`;
            parlayPicks.forEach(p => {
              const resClass = p.result ? `res-${p.result}` : 'res-pending';
              html += `<div class="${resClass}"><strong>${p.players?.initials || '??'}:</strong> ${p.selection}</div>`;
            });
            html += `</div>`;
          }

          if (otherPicks.length >0) {
            html += `<div class="history-category">Others:</div><div class="history-picks-list">`;
            otherPicks.forEach(p => {
              const resClass = p.result ? `res-${p.result}` : 'res-pending';
              html += `<div class="${resClass}"><strong>${p.players?.initials || '??'}:</strong> ${p.selection}</div>`;
            });
            html += `</div>`;
          }
        }

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    loadSeasonHistory();
  </script>
</body>
</html>

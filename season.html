<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Season History</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    .superlatives-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .sup-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .sup-box h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .sup-box .val { font-size: 1.15rem; font-weight: bold; color: var(--text); }
    .sup-box .sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .streak-hot { color: var(--success); font-weight: bold; }
    .streak-cold { color: var(--danger); font-weight: bold; }

    .msg { text-align: center; color: var(--text-muted); padding: 1.5rem; font-style: italic; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBBC Season History</h1>
      <p>Performance Trends & Superlatives</p>
    </header>

    <nav>
      <a href="index.html">Weekly Picks</a>
      <a href="standings.html">Standings</a>
      <a href="season.html" class="active">Season History</a>
    </nav>

    <!-- Superlatives Section -->
    <div class="superlatives-grid">
      <div class="sup-box">
        <h3>🔥 Biggest Cover</h3>
        <div class="val" id="biggest-cover">Calculating...</div>
        <div class="sub" id="biggest-cover-sub">-</div>
      </div>
      <div class="sup-box">
        <h3>💔 Worst Beat</h3>
        <div class="val" id="worst-beat">Calculating...</div>
        <div class="sub" id="worst-beat-sub">-</div>
      </div>
    </div>

    <div class="card">
      <h2>Player Streaks & Performance</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th>Current Streak</th>
              <th>Total Wins</th>
              <th>Total Losses</th>
              <th>Total Draws</th>
            </tr>
          </thead>
          <tbody id="season-tbody">
            <tr><td colspan="5" class="msg">Loading season history...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSeasonHistory() {
      const tbody = document.getElementById('season-tbody');

      const { data: players, error: playerErr } = await _supabase
        .from('players')
        .select('*');

      const { data: picks, error: pickErr } = await _supabase
        .from('picks')
        .select('*');

      if (playerErr || pickErr) {
        tbody.innerHTML = `<tr><td colspan="5" class="msg" style="color: var(--danger);">Error loading season history.</td></tr>`;
        return;
      }

      // Map player names for quick lookup
      const playerMap = {};
      players.forEach(p => { playerMap[p.id] = p.initials; });

      // Group picks by player
      const playerPicks = {};
      picks.forEach(p => {
        if (!playerPicks[p.player_id]) {
          playerPicks[p.player_id] = [];
        }
        playerPicks[p.player_id].push(p);
      });

      // Calculate Streaks & Records
      const seasonData = players.map(p => {
        const pPicks = playerPicks[p.id] || [];
        pPicks.sort((a, b) => (a.week || 0) - (b.week || 0) || (a.id || 0) - (b.id || 0));

        let wins = 0, losses = 0, draws = 0;
        let streakCount = 0;
        let streakType = null;

        for (let i = pPicks.length - 1; i >= 0; i--) {
          const res = pPicks[i].result;
          if (res === 'W') {
            if (streakType === null) streakType = 'W';
            if (streakType === 'W') streakCount++;
            else if (streakType === 'L') break;
          } else if (res === 'L') {
            if (streakType === null) streakType = 'L';
            if (streakType === 'L') streakCount++;
            else if (streakType === 'W') break;
          }
        }

        pPicks.forEach(pick => {
          if (pick.result === 'W') wins++;
          else if (pick.result === 'L') losses++;
          else if (pick.result === 'D') draws++;
        });

        return {
          initials: p.initials,
          wins,
          losses,
          draws,
          streakText: streakType ? `${streakType}${streakCount}` : '-'
        };
      });

      // Calculate Superlatives (Biggest Cover & Worst Beat) based on available margin/score data
      let bestCover = null;
      let worstBeat = null;

      picks.forEach(p => {
        // Checking for margin data fields (e.g., margin, cover_amount, or difference)
        const margin = p.margin !== undefined ? Number(p.margin) : (p.cover_amount !== undefined ? Number(p.cover_amount) : null);
        
        if (margin !== null && !isNaN(margin)) {
          if (p.result === 'W') {
            if (!bestCover || margin > bestCover.margin) {
              bestCover = { margin, player: playerMap[p.player_id] || 'Unknown', game: p.team || p.game || 'Pick' };
            }
          } else if (p.result === 'L') {
            if (!worstBeat || margin < worstBeat.margin) {
              worstBeat = { margin, player: playerMap[p.player_id] || 'Unknown', game: p.team || p.game || 'Pick' };
            }
          }
        }
      });

      // Update Superlative UI elements
      const coverEl = document.getElementById('biggest-cover');
      const coverSub = document.getElementById('biggest-cover-sub');
      const beatEl = document.getElementById('worst-beat');
      const beatSub = document.getElementById('worst-beat-sub');

      if (bestCover) {
        coverEl.textContent = `${bestCover.player} (+${bestCover.margin})`;
        coverSub.textContent = bestCover.game;
      } else {
        coverEl.textContent = 'None recorded';
        coverSub.textContent = 'Awaiting margin data';
      }

      if (worstBeat) {
        beatEl.textContent = `${worstBeat.player} (${worstBeat.margin})`;
        beatSub.textContent = worstBeat.game;
      } else {
        beatEl.textContent = 'None recorded';
        beatSub.textContent = 'Awaiting margin data';
      }

      tbody.innerHTML = '';

      if (seasonData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="msg">No player records found.</td></tr>`;
        return;
      }

      seasonData.forEach(p => {
        let streakClass = '';
        if (p.streakText.startsWith('W')) streakClass = 'streak-hot';
        else if (p.streakText.startsWith('L')) streakClass = 'streak-cold';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.initials}</strong></td>
          <td><span class="${streakClass}">${p.streakText}</span></td>
          <td>${p.wins}</td>
          <td>${p.losses}</td>
          <td>${p.draws}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadSeasonHistory();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Season Stats</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: scroll;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; flex-wrap: wrap; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    /* Metrics Grid Layout */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .metric-box h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .metric-box .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .metric-box .metric-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    
    .loading-text { text-align: center; color: var(--text-muted); padding: 1rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBBC Season Stats</h1>
      <p>Overall Team Metrics & Deep Dives</p>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html" class="active">Season</a>
      <a href="scores.html">Scores</a>
      <a href="admin.html">Admin</a>
      <a href="halloffame.html">HOF</a>
    </nav>

    <!-- Team Metrics Card -->
    <div class="card">
      <h2>Team Betting Metrics</h2>
      <div class="metrics-grid">
        <div class="metric-box">
          <h3>Top Picked Team</h3>
          <div class="metric-value" id="top-team-val">-</div>
          <div class="metric-sub" id="top-team-sub">Most correct outcomes</div>
        </div>
        <div class="metric-box">
          <h3>Spread Record</h3>
          <div class="metric-value" id="spread-record-val">0-0-0</div>
          <div class="metric-sub">Overall ATS</div>
        </div>
        <div class="metric-box">
          <h3>O/U Record</h3>
          <div class="metric-value" id="ou-record-val">0-0-0</div>
          <div class="metric-sub">Overall Totals</div>
        </div>
      </div>
    </div>

    <!-- Season Summary Card (No Courtside Links) -->
    <div class="card">
      <h2>Season Overview</h2>
      <div id="season-overview-container">
        <div class="loading-text">Loading season data...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadSeasonData() {
      const overviewContainer = document.getElementById('season-overview-container');

      // Fetch picks with related week info
      const { data: picks, error: picksError } = await _supabase
        .from('picks')
        .select('*, weeks(week_number, status), players(initials)');

      if (picksError) {
        overviewContainer.innerHTML = `<div class="loading-text" style="color: var(--danger);">Error loading season stats.</div>`;
        return;
      }

      if (!picks || picks.length === 0) {
        overviewContainer.innerHTML = `<div class="loading-text">No picks recorded for this season yet.</div>`;
        return;
      }

      let spreadWins = 0, spreadLosses = 0, spreadPushes = 0;
      let ouWins = 0, ouLosses = 0, ouPushes = 0;
      const teamCorrectCounts = {};

      picks.forEach(p => {
        const selection = (p.selection || '').trim();
        const result = p.result; // 'W', 'L', 'D'

        if (!result) return;

        // Detect if selection is Over/Under vs Spread
        const lowerSel = selection.toLowerCase();
        const isOU = lowerSel.startsWith('over') || lowerSel.startsWith('under');

        if (isOU) {
          if (result === 'W') ouWins++;
          else if (result === 'L') ouLosses++;
          else if (result === 'D') ouPushes++;
        } else {
          if (result === 'W') spreadWins++;
          else if (result === 'L') spreadLosses++;
          else if (result === 'D') spreadPushes++;
        }

        // Extract team name for correct predictions tracking (Winning outcomes only)
        if (result === 'W') {
          // Simple heuristic: strip numbers, points, spreads to get team identifier
          const cleanTeam = selection.replace(/[+-]?\d+(\.\d+)?/g, '').trim();
          if (cleanTeam && !lowerSel.startsWith('over') && !lowerSel.startsWith('under')) {
            teamCorrectCounts[cleanTeam] = (teamCorrectCounts[cleanTeam] || 0) + 1;
          }
        }
      });

      // Update Metrics Blocks
      document.getElementById('spread-record-val').innerText = `${spreadWins}-${spreadLosses}-${spreadPushes}`;
      document.getElementById('ou-record-val').innerText = `${ouWins}-${ouLosses}-${ouPushes}`;

      // Find top predicted team
      let topTeam = 'None yet';
      let maxCount = 0;
      for (const [team, count] of Object.entries(teamCorrectCounts)) {
        if (count > maxCount) {
          maxCount = count;
          topTeam = team;
        }
      }

      document.getElementById('top-team-val').innerText = maxCount > 0 ? topTeam : 'None';
      document.getElementById('top-team-sub').innerText = maxCount > 0 ? `${maxCount} correct picks` : 'No winning bets logged';

      // Render Season Overview table (Grouped by Week, excluding Courtside links)
      const weekGroups = {};
      picks.forEach(p => {
        const wkNum = p.weeks?.week_number ?? '??';
        if (!weekGroups[wkNum]) weekGroups[wkNum] = [];
        weekGroups[wkNum].push(p);
      });

      const sortedWeeks = Object.keys(weekGroups).sort((a, b) => b - a);

      let html = '';
      sortedWeeks.forEach(wkNum => {
        const wkPicks = weekGroups[wkNum];
        html += `
          <div style="margin-top: 1rem; font-weight: 700; color: var(--gold); font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem;">
            Week ${wkNum} <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">(${wkPicks.length} total picks)</span>
          </div>
        `;
      });

      overviewContainer.innerHTML = html;
    }

    loadSeasonData();
  </script>
</body>
</html>

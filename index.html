<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
      --accent: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    /* Week Section Styling */
    .week-section { margin-bottom: 2.5rem; text-align: center; }
    .week-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--text); }
    .category-title { font-size: 1.15rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Picks Inline Flow */
    .picks-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.5rem; margin-bottom: 1rem; font-size: 1.1rem; }
    .pick-item { font-weight: 700; }

    /* Result Color Coding */
    .res-W { color: var(--success); }
    .res-L { color: var(--danger); }
    .res-D { color: var(--warning); }
    .res-pending { color: var(--text); }

    /* Gambly Link Button Styling */
    .btn-gambly {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 1.25rem auto 0 auto;
      background-color: var(--accent);
      color: white;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    .btn-gambly:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">BBBCWSCLP</h1>
    </header>

    <nav>
      <a href="index.html" class="active">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div id="content-container">
      <div style="color: var(--text-muted);">Loading active week picks...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadActiveWeek() {
      const { data: weeks, error: weekError } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .limit(1);

      const container = document.getElementById('content-container');
      container.innerHTML = '';

      if (weekError || !weeks || weeks.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted);">No open weeks currently active. Check Season History for past weeks.</div>';
        return;
      }

      const currentWeek = weeks[0];

      // Fetch picks and explicitly join player records
      const { data: picks, error: picksError } = await _supabase
        .from('picks')
        .select('*, players(*)')
        .eq('week_id', currentWeek.id)
        .order('created_at', { ascending: true });

      if (picksError || !picks || picks.length === 0) {
        container.innerHTML = `<div class="week-section"><div class="week-title">Week ${currentWeek.week_number} Parlay:</div><div style="color: var(--text-muted);">No picks submitted for this week yet.</div></div>`;
        return;
      }

      let parlayPicks = [];
      let otherPicks = [];

      if (currentWeek.week_number === 1) {
        parlayPicks = picks;
        otherPicks = [];
      } else {
        const prevWeekNum = currentWeek.week_number - 1;
        const { data: prevWeekData } = await _supabase
          .from('weeks')
          .select('id')
          .eq('week_number', prevWeekNum)
          .limit(1);

        if (prevWeekData && prevWeekData.length > 0) {
          const prevWeekId = prevWeekData[0].id;
          const { data: prevPicks } = await _supabase
            .from('picks')
            .select('*')
            .eq('week_id', prevWeekId);

          const mappedPicks = picks.map(p => {
            const prevPick = prevPicks ? prevPicks.find(pp => pp.player_id === p.player_id) : null;
            return {
              ...p,
              prevResult: prevPick ? prevPick.result : null,
              prevMargin: prevPick ? (prevPick.cover_margin || 0) : 0
            };
          });

          mappedPicks.sort((a, b) => {
            const aWin = a.prevResult === 'W' ? 1 : 0;
            const bWin = b.prevResult === 'W' ? 1 : 0;
            if (aWin !== bWin) return bWin - aWin;
            return b.prevMargin - a.prevMargin;
          });

          parlayPicks = mappedPicks.slice(0, 5);
          otherPicks = mappedPicks.slice(5);
        } else {
          parlayPicks = picks;
          otherPicks = [];
        }
      }

      let html = `<div class="week-section">`;
      html += `<div class="week-title">Week ${currentWeek.week_number} Parlay:</div>`;

      if (parlayPicks.length > 0) {
        html += `<div class="picks-group">`;
        parlayPicks.forEach(p => {
          const resClass = p.result ? `res-${p.result}` : 'res-pending';
          const initials = p.players?.initials || p.player_initials || '??';
          html += `<div class="pick-item ${resClass}">${initials}: ${p.selection}</div>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="picks-group" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">No consensus parlay picks designated yet.</div>`;
      }

      // --- DYNAMIC STACKED BUTTONS ---
      if (currentWeek.slip_link || currentWeek.gambly_link) {
        html += `<div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.5rem; margin-bottom: 1.5rem; width: 100%; align-items: center;">`;
        
        if (currentWeek.slip_link) {
          html += `
            <a href="${currentWeek.slip_link}" target="_blank" class="btn-gambly" style="margin: 0; background-color: var(--accent);">
              📲 Open Slip in Courtside
            </a>
          `;
        }
        
        if (currentWeek.gambly_link) {
          html += `
            <a href="${currentWeek.gambly_link}" target="_blank" class="btn-gambly" style="margin: 0; background-color: #334155; color: var(--text);">
              🎲 Open Gambly Link
            </a>
          `;
        }
        
        html += `</div>`;
      }

      if (otherPicks.length > 0) {
        html += `
          <div class="category-title">Others:</div>
          <div class="picks-group">
        `;
        otherPicks.forEach(p => {
          const resClass = p.result ? `res-${p.result}` : 'res-pending';
          const initials = p.players?.initials || p.player_initials || '??';
          html += `<div class="pick-item ${resClass}">${initials}: ${p.selection}</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    loadActiveWeek();
  </script>
</body>
</html>

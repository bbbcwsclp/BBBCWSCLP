<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Boys Betting Club (BBBC)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem 4rem 1rem; max-width: 1000px; margin: 0 auto; min-height: 100vh; }

    header { text-align: center; margin-bottom: 2rem; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .grid-container { display: grid; grid-template-columns: 1fr; gap: 2rem; }
    
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; background-color: #0f172a; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }

    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; font-size: 0.75rem; text-align: center; }
    .badge-spread { background-color: #1e3a8a; color: #93c5fd; }
    .badge-ou { background-color: #312e81; color: #c7d2fe; }

    .res-W { color: var(--success); font-weight: bold; }
    .res-L { color: var(--danger); font-weight: bold; }
    .res-D { color: var(--warning); font-weight: bold; }

    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.75rem; }
    .player-chip { background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; text-align: center; font-weight: 700; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <!-- Logo display (looks for logo.png in your repository) -->
    <img src="logo.png" alt="BBBC Logo" onerror="this.style.display='none'">
    <h1>Big Boys Betting Club</h1>
    <p>Season 2026 • Standings & Weekly Picks</p>
  </header>

  <nav>
    <a href="index.html" class="active">Weekly Picks</a>
    <a href="standings.html">Standings</a>
  </nav>

  <div class="grid-container">
    <!-- Weekly Picks Section -->
    <div class="card">
      <h2>Weekly Picks Log</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th>Type</th>
              <th>Selection & Game</th>
              <th>Result</th>
              <th>Margin</th>
            </tr>
          </thead>
          <tbody id="public-picks-tbody">
            <tr><td colspan="5" style="color: var(--text-muted);">Loading weekly picks...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Active Roster Section -->
    <div class="card">
      <h2>Active Members</h2>
      <div class="roster-grid" id="roster-grid">
        Loading roster...
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPublicData() {
      // 1. Fetch active players for the roster grid
      const { data: players } = await _supabase
        .from('players')
        .select('*')
        .eq('active', true)
        .order('initials', { ascending: true });

      const rosterGrid = document.getElementById('roster-grid');
      rosterGrid.innerHTML = '';
      if (players) {
        players.forEach(p => {
          const chip = document.createElement('div');
          chip.className = 'player-chip';
          chip.textContent = p.initials;
          rosterGrid.appendChild(chip);
        });
      }

      // 2. Fetch open week and load picks
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .limit(1);

      if (!weeks || weeks.length === 0) return;
      const weekId = weeks[0].id;

      const { data: picks } = await _supabase
        .from('picks')
        .select('*, players(initials)')
        .eq('week_id', weekId)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('public-picks-tbody');
      tbody.innerHTML = '';

      if (!picks || picks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: var(--text-muted);">No picks submitted for this week yet.</td></tr>';
        return;
      }

      picks.forEach(p => {
        const tr = document.createElement('tr');
        const badgeClass = p.pick_type === 'spread' ? 'badge-spread' : 'badge-ou';
        const typeLabel = p.pick_type === 'spread' ? 'SPREAD' : 'O/U';
        const resClass = p.result ? `res-${p.result}` : '';
        const resText = p.result ? p.result : 'Pending';

        tr.innerHTML = `
          <td><strong>${p.players?.initials || '??'}</strong></td>
          <td><span class="badge ${badgeClass}">${typeLabel}</span></td>
          <td>${p.selection} <br><small style="color:var(--text-muted);">${p.game}</small></td>
          <td><span class="${resClass}">${resText}</span></td>
          <td>${p.cover_margin !== null ? p.cover_margin : '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadPublicData();
  </script>
</body>
</html>

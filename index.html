<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Boys Betting Club</title>
  <!-- Load Supabase Library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>BBBC Roster</h1>
  <ul id="player-list">Loading players...</ul>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    // Initialize Supabase Client
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fetch players from your database and display on page
    async function loadPlayers() {
      const { data: players, error } = await supabase
        .from('players')
        .select('*');

      const listElement = document.getElementById('player-list');
      
      if (error) {
        listElement.innerHTML = 'Error loading players: ' + error.message;
        return;
      }

      listElement.innerHTML = '';
      players.forEach(player => {
        const li = document.createElement('li');
        li.textContent = `Player: ${player.initials}`;
        listElement.appendChild(li);
      });
    }

    loadPlayers();
  </script>
</body>
</html>

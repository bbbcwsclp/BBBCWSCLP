<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Boys Betting Club (BBBC)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --danger: rgba(239, 68, 68, 0.15);
      --danger-text: #f87171;
      --warning-text: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 800px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2.5rem; font-weight: 600; font-size: 0.95rem; width: 100%; }
    nav a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #93c5fd; text-decoration: underline; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 2rem; width: 100%; }
    .card h2 { font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; text-align: center; }

    /* Centered Table Fix */
    .table-wrapper { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; background-color: #0f172a; }

    /* Row Result Highlighting */
    tr.res-W { background-color: var(--success); }
    tr.res-W td { color: var(--success-text); }
    
    tr.res-L { background-color: var(--danger); }
    tr.res-L td { color: var(--danger-text); }

    tr.res-D td { color: var(--warning-text); }

    .badge { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 4px; font-weight: bold; font-size: 0.7rem; text-align: center; margin-right: 0.3rem; vertical-align: middle; }
    .badge-spread { background-color: #1e3a8a; color: #93c5fd; }
    .badge-ou { background-color: #312e81; color: #c7d2fe; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1>Big Boys Betting Club</h1>
      <p>Season 2026 • Weekly Picks</p>
    </header>

    <nav>
      <a href="index.html" class="active">Weekly Picks</a>
      <a href="standings.html">Standings</a>
    </nav>

    <div class="card">
      <h2>Weekly Picks Log</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 25%;">Member</th>
              <th style="width: 75%;">Selection & Game</th>
            </tr>
          </thead>
          <tbody id="public-picks-tbody">
            <tr><td colspan="2" style="text-align: center; color: var(--text-muted);">Loading weekly picks...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPublicData() {
      // Fetch open week
      const { data: weeks } = await _supabase
        .from('weeks')
        .select('*')
        .eq('status', 'open')
        .limit(1);

      const tbody = document.getElementById('public-picks-tbody');

      if (!weeks || weeks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: var(--text-muted);">No open weeks found.</td></tr>';
        return;
      }
      const weekId = weeks[0].id;

      const { data: picks } = await _supabase
        .from('picks')
        .select('*, players(initials)')
        .eq('week_id', weekId)
        .order('created_at', { ascending: false });

      tbody.innerHTML = '';

      if (!picks || picks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: var(--text-muted);">No picks submitted for this week yet.</td></tr>';
        return;
      }

      picks.forEach(p => {
        const tr = document.createElement('tr');
        
        if (p.result) {
          tr.className = `res-${p.result}`;
        }

        const badgeClass = p.pick_type === 'spread' ? 'badge-spread' : 'badge-ou';
        const typeLabel = p.pick_type === 'spread' ? 'SPREAD' : 'O/U';

        tr.innerHTML = `
          <td><strong>${p.players?.initials || '??'}</strong></td>
          <td>
            <span class="badge ${badgeClass}">${typeLabel}</span>
            <strong>${p.selection}</strong> 
            <br><small style="opacity: 0.8; font-size: 0.85rem;">${p.game}</small>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadPublicData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Live Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 5rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: scroll;
    }

    .container { width: 100%; max-width: 680px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 2.25rem; font-weight: 800; color: var(--text); }
    header p { color: var(--text-muted); margin-top: 0.3rem; }

    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.5rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
      max-width: 380px; 
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.85rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-color: var(--accent);
      background-color: #273548;
    }

    nav a.active { 
      color: white; 
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .controls-card input, .controls-card select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .controls-card input:focus, .controls-card select:focus {
      border-color: var(--accent);
    }

    .scores-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .score-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .score-card:hover {
      border-color: var(--text-muted);
    }

    .teams-col {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-grow: 1;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 1.5rem;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .team-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .team-name.winner {
      color: var(--success);
    }

    .team-score {
      font-size: 1.1rem;
      font-weight: 700;
      min-width: 30px;
      text-align: right;
    }

    .game-status-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 100px;
      gap: 0.2rem;
      border-left: 1px solid var(--border);
      padding-left: 1rem;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-badge.live {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .status-badge.final {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .status-badge.upcoming {
      background-color: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
    }

    .detail-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .msg-center {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BBBC Live Scores</h1>
      <p>Real-Time FCS Game Tracker & Scores</p>
    </header>

    <nav>
      <a href="testindex.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="testscores.html" class="active">Scores</a>
      <a href="admin.html">Admin</a>
      <a href="halloffame.html">HOF</a>
    </nav>

    <div class="controls-card">
      <input type="text" id="search-filter" placeholder="🔍 Search team..." oninput="filterGames()">
      <select id="status-filter" onchange="filterGames()">
        <option value="all">All Games</option>
        <option value="live">Live / In-Progress</option>
        <option value="final">Final</option>
        <option value="upcoming">Upcoming</option>
      </select>
    </div>

    <div id="scores-container" class="scores-grid">
      <div class="msg-center">Loading FCS scoreboard feed...</div>
    </div>
  </div>

  <script>
    let allGamesCache = [];

    async function fetchLiveScores() {
      const container = document.getElementById('scores-container');

      try {
        const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=150&limit=400');
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<div class="msg-center">No FCS games found for this schedule.</div>';
          return;
        }

        allGamesCache = data.events;
        renderGames(allGamesCache);

      } catch (err) {
        console.error('Error fetching scores:', err);
        container.innerHTML = '<div class="msg-center" style="color: var(--danger);">Error connecting to ESPN score feed.</div>';
      }
    }

    function renderGames(events) {
      const container = document.getElementById('scores-container');
      const searchTerm = document.getElementById('search-filter').value.toLowerCase().trim();
      const statusFilter = document.getElementById('status-filter').value;

      container.innerHTML = '';

      let displayedCount = 0;

      events.forEach(event => {
        const comp = event.competitions[0];
        const home = comp.competitors.find(c => c.homeAway === 'home');
        const away = comp.competitors.find(c => c.homeAway === 'away');

        const homeName = home.team.displayName || home.team.name;
        const awayName = away.team.displayName || away.team.name;
        const homeAbbr = home.team.abbreviation;
        const awayAbbr = away.team.abbreviation;
        const homeLogo = home.team.logo || '';
        const awayLogo = away.team.logo || '';
        const homeScore = parseInt(home.score || '0', 10);
        const awayScore = parseInt(away.score || '0', 10);

        const gameState = comp.status.type.state; // pre, in, post
        const isCompleted = comp.status.type.completed;
        const statusDetail = comp.status.type.shortDetail;

        let statusCategory = 'upcoming';
        if (gameState === 'in') statusCategory = 'live';
        else if (gameState === 'post' || isCompleted) statusCategory = 'final';

        // Apply filters
        if (statusFilter !== 'all' && statusCategory !== statusFilter) return;
        if (searchTerm && !homeName.toLowerCase().includes(searchTerm) && !awayName.toLowerCase().includes(searchTerm) && !homeAbbr.toLowerCase().includes(searchTerm) && !awayAbbr.toLowerCase().includes(searchTerm)) return;

        displayedCount++;

        const isHomeWinner = isCompleted && homeScore > awayScore;
        const isAwayWinner = isCompleted && awayScore > homeScore;

        const card = document.createElement('div');
        card.className = 'score-card';
        card.innerHTML = `
          <div class="teams-col">
            <div class="team-row">
              <div class="team-info">
                ${awayLogo ? `<img src="${awayLogo}" class="team-logo" alt="">` : ''}
                <span class="team-name ${isAwayWinner ? 'winner' : ''}">${awayName}</span>
              </div>
              <span class="team-score">${gameState === 'pre' ? '-' : awayScore}</span>
            </div>
            <div class="team-row">
              <div class="team-info">
                ${homeLogo ? `<img src="${homeLogo}" class="team-logo" alt="">` : ''}
                <span class="team-name ${isHomeWinner ? 'winner' : ''}">${homeName}</span>
              </div>
              <span class="team-score">${gameState === 'pre' ? '-' : homeScore}</span>
            </div>
          </div>
          <div class="game-status-col">
            <span class="status-badge ${statusCategory}">${gameState === 'in' ? 'LIVE' : (statusCategory === 'final' ? 'Final' : 'Upcoming')}</span>
            <span class="detail-time">${statusDetail}</span>
          </div>
        `;
        container.appendChild(card);
      });

      if (displayedCount === 0) {
        container.innerHTML = '<div class="msg-center">No games match your current filter.</div>';
      }
    }

    function filterGames() {
      renderGames(allGamesCache);
    }

    // Initial load and auto-refresh every 60 seconds for live updates
    fetchLiveScores();
    setInterval(fetchLiveScores, 60000);
  </script>
</body>
</html>

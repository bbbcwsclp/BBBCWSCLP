<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — FBS Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e10;
      --card-bg: #14191d;
      --card-inner: #060a0c;
      --text: #eef2f2;
      --text-muted: #7c8a90;
      --border: #223038;

      --success: #34d67a;
      --danger: #ff6b6b;
      --warning: #ffb020;

      --accent: #ffb020;
      --gold: #ffb020;

      --font-display: 'Anton', 'Arial Narrow', sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', monospace;
      --font-label: 'Barlow Condensed', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-label);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255, 176, 32, 0.05), transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(20, 25, 29, 0.9), var(--bg) 70%),
        linear-gradient(rgba(34, 48, 56, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 48, 56, 0.18) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      background-position: center top, center top, center top, center top;
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1.main-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1;
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    nav a {
      font-family: var(--font-label);
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      background-color: transparent;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px 4px 0 0;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--text);
      border-bottom-color: var(--accent);
      background-color: rgba(255, 176, 32, 0.06);
    }

    nav a.active {
      color: var(--accent);
      background-color: rgba(255, 176, 32, 0.08);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
    }

    nav a:focus-visible, .filter-btn:focus-visible, .team-search-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Search & Filter Section */
    .controls-wrapper {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .team-search-input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-family: var(--font-label);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: border-color 0.2s;
    }

    .team-search-input::placeholder {
      color: var(--text-muted);
    }

    .team-search-input:focus {
      border-color: var(--accent);
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-family: var(--font-label);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* Game Card Styling Matching Index Scores Grid */
    .compact-scores-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
      text-align: left;
    }

    .compact-card {
      background-color: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 4px;
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .compact-card:has(.compact-status.live) {
      border-left-color: var(--success);
    }

    .compact-left {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex-grow: 1;
      min-width: 0;
    }

    .game-meta-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .compact-status {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      width: fit-content;
    }
    .compact-status.live {
      background-color: rgba(52, 214, 122, 0.12);
      color: var(--success);
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      border: 1px solid rgba(52, 214, 122, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .compact-status.live::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--success);
      animation: tk-pulse 1.4s ease-in-out infinite;
    }
    .compact-status.final {
      color: var(--text-muted);
    }
    .compact-status.sched {
      color: var(--accent);
      background-color: rgba(255, 176, 32, 0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      border: 1px solid rgba(255, 176, 32, 0.3);
    }

    @keyframes tk-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .situation-text {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.68rem;
      font-family: var(--font-mono);
    }

    .broadcast-text {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .compact-teams {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      align-items: flex-end;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .compact-team-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .compact-logo { width: 18px; height: 18px; object-fit: contain; }
    .compact-team-name-wrap {
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .compact-team-abbr {
      font-family: var(--font-label);
      font-weight: 700;
      color: var(--text);
      min-width: 34px;
      text-align: left;
      letter-spacing: 0.3px;
    }
    .compact-team-rank {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
    }
    .compact-score {
      font-family: var(--font-mono);
      font-weight: 700;
      min-width: 26px;
      text-align: right;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.05rem 0.3rem;
    }
    .winner { color: var(--accent); }
    .winner.compact-score { border-color: rgba(255, 176, 32, 0.4); }

    .odds-line {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.15rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .loading-msg, .error-msg { color: var(--text-muted); padding: 2rem; font-size: 0.95rem; }
    .error-msg { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <div class="eyebrow">Live Scoreboard</div>
      <h1 class="main-title">Scores</h1>
    </header>

    <nav>
      <a href="testindex.html">Weekly</a>
      <a href="teststandings.html">Standings</a>
      <a href="testseason.html">Season</a>
      <a href="testhalloffame.html">HOF</a>
      <a href="testscores.html" class="active">Scores</a>
    </nav>

    <div class="controls-wrapper">
      <input type="text" id="team-search" class="team-search-input" placeholder="🔍 Search team name or abbreviation (e.g. Alabama, USC, Ohio State)..." oninput="renderGames()">
      
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterGames('all', event)">All FBS</button>
        <button class="filter-btn" onclick="filterGames('sec', event)">SEC</button>
        <button class="filter-btn" onclick="filterGames('big10', event)">Big Ten</button>
        <button class="filter-btn" onclick="filterGames('acc', event)">ACC</button>
        <button class="filter-btn" onclick="filterGames('big12', event)">Big 12</button>
      </div>
    </div>

    <div id="scores-container">
      <div class="loading-msg">Fetching matchups...</div>
    </div>
  </div>

  <script>
    let rawEvents = [];
    let currentFilter = 'all';
    let hasLoadedOnce = false;

    async function fetchScores(isBackgroundRefresh = false) {
      const container = document.getElementById('scores-container');
      const apiURL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300';

      try {
        if (!isBackgroundRefresh && !hasLoadedOnce) {
          container.innerHTML = '<div class="loading-msg">Fetching matchups...</div>';
        }

        const response = await fetch(apiURL);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          if (!hasLoadedOnce) {
            container.innerHTML = '<div class="loading-msg">No games scheduled.</div>';
          }
          return;
        }

        rawEvents = data.events;
        hasLoadedOnce = true;
        renderGames();

      } catch (err) {
        console.error('Error loading scores:', err);
        if (!hasLoadedOnce) {
          container.innerHTML = '<div class="error-msg">Could not load live FBS scores. Please try again later.</div>';
        }
      }
    }

    function filterGames(conf, clickEvent) {
      currentFilter = conf;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (clickEvent && clickEvent.target) {
        clickEvent.target.classList.add('active');
      }
      renderGames();
    }

    function renderGames() {
      const container = document.getElementById('scores-container');
      const searchQuery = (document.getElementById('team-search').value || '').trim().toLowerCase();
      let filteredEvents = rawEvents;

      // Conference Filtering Logic
      if (currentFilter !== 'all') {
        filteredEvents = filteredEvents.filter(event => {
          const comp = event.competitions[0];
          const homeConf = comp.competitors[0]?.team?.conferenceId;
          const awayConf = comp.competitors[1]?.team?.conferenceId;

          if (currentFilter === 'sec') return homeConf === '8' || awayConf === '8';
          if (currentFilter === 'big10') return homeConf === '5' || awayConf === '5';
          if (currentFilter === 'acc') return homeConf === '1' || awayConf === '1';
          if (currentFilter === 'big12') return homeConf === '4' || awayConf === '4';
          return true;
        });
      }

      // Search Filtering Logic
      if (searchQuery) {
        filteredEvents = filteredEvents.filter(event => {
          const comp = event.competitions[0];
          return comp.competitors.some(c => {
            const name = (c.team.name || '').toLowerCase();
            const displayName = (c.team.displayName || '').toLowerCase();
            const shortName = (c.team.shortDisplayName || '').toLowerCase();
            const abbreviation = (c.team.abbreviation || '').toLowerCase();
            return name.includes(searchQuery) || displayName.includes(searchQuery) || shortName.includes(searchQuery) || abbreviation.includes(searchQuery);
          });
        });
      }

      if (filteredEvents.length === 0) {
        container.innerHTML = '<div class="loading-msg">No games found matching your search.</div>';
        return;
      }

      filteredEvents.sort((a, b) => {
        const stateA = a.competitions[0].status.type.state;
        const stateB = b.competitions[0].status.type.state;

        const getPriority = (state) => {
          if (state === 'in') return 1;
          if (state === 'pre') return 2;
          if (state === 'post') return 3;
          return 4;
        };

        return getPriority(stateA) - getPriority(stateB);
      });

      let html = `<div class="compact-scores-grid">`;

      filteredEvents.forEach(event => {
        const competition = event.competitions[0];
        const statusType = competition.status.type.state;
        const statusDetail = competition.status.type.detail;

        const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
        const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

        const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current}` : '';
        const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current}` : '';

        const homeAbbr = homeTeam.team.abbreviation || homeTeam.team.shortDisplayName || 'HOME';
        const awayAbbr = awayTeam.team.abbreviation || awayTeam.team.shortDisplayName || 'AWAY';

        const homeLogo = homeTeam.team.logo || '';
        const awayLogo = awayTeam.team.logo || '';

        const homeScore = homeTeam.score || '0';
        const awayScore = awayTeam.score || '0';

        let situationHTML = '';
        if (statusType === 'in' && competition.situation) {
          const sit = competition.situation;
          if (sit.downText && sit.shortDisplayName) {
            situationHTML = `<span class="situation-text">🏈 ${sit.downText} &bull; ${sit.shortDisplayName}</span>`;
          }
        }

        const broadcast = competition.broadcasts && competition.broadcasts.length > 0
          ? competition.broadcasts[0].names.join(', ')
          : '';

        const oddsObj = competition.odds && competition.odds.length > 0 ? competition.odds[0] : null;
        const spreadText = oddsObj?.details ? `Spread: ${oddsObj.details}` : '';
        const ouText = oddsObj?.overUnder ? `O/U: ${oddsObj.overUnder}` : '';

        let badgeClass = 'sched';
        let statusLabel = statusDetail;
        if (statusType === 'in') {
          badgeClass = 'live';
          statusLabel = `LIVE • ${statusDetail}`;
        } else if (statusType === 'post') {
          badgeClass = 'final';
          statusLabel = 'FINAL';
        }

        const isHomeWinner = statusType === 'post' && parseInt(homeScore, 10) > parseInt(awayScore, 10);
        const isAwayWinner = statusType === 'post' && parseInt(awayScore, 10) > parseInt(homeScore, 10);

        html += `
          <div class="compact-card">
            <div class="compact-left">
              <div class="game-meta-row">
                <span class="compact-status ${badgeClass}">${statusLabel}</span>
                ${situationHTML}
                ${broadcast ? `<span class="broadcast-text">📺 ${broadcast}</span>` : ''}
              </div>
              ${(spreadText || ouText) ? `
                <div class="odds-line">
                  ${spreadText ? `<span>${spreadText}</span>` : ''}
                  ${ouText ? `<span>${ouText}</span>` : ''}
                </div>
              ` : ''}
            </div>
            <div class="compact-teams">
              <div class="compact-team-row">
                <img src="${awayLogo}" class="compact-logo" onerror="this.style.display='none'">
                <div class="compact-team-name-wrap">
                  <span class="compact-team-abbr ${isAwayWinner ? 'winner' : ''}">${awayAbbr}</span>
                  ${awayRank ? `<span class="compact-team-rank">${awayRank}</span>` : ''}
                </div>
                <span class="compact-score ${isAwayWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : awayScore}</span>
              </div>
              <div class="compact-team-row">
                <img src="${homeLogo}" class="compact-logo" onerror="this.style.display='none'">
                <div class="compact-team-name-wrap">
                  <span class="compact-team-abbr ${isHomeWinner ? 'winner' : ''}">${homeAbbr}</span>
                  ${homeRank ? `<span class="compact-team-rank">${homeRank}</span>` : ''}
                </div>
                <span class="compact-score ${isHomeWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : homeScore}</span>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }

    fetchScores(false);

    setInterval(() => {
      fetchScores(true);
    }, 10000);
  </script>
</body>
</html>

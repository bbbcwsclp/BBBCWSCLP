<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — FBS Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --gold: #f59e0b;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem 4rem 1rem; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 100px; margin-bottom: 0.75rem; object-fit: contain; }
    
    h1.main-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 1.5rem; color: var(--text); }

    /* Navigation Bar */
    nav { 
      display: flex; 
      justify-content: center; 
      gap: 0.35rem; 
      margin-bottom: 2.5rem; 
      width: 100%; 
    }
    
    nav a { 
      color: var(--text-muted); 
      text-decoration: none; 
      transition: all 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-weight: 600; 
      font-size: 0.82rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    
    nav a:hover { 
      color: var(--text); 
      border-color: var(--accent);
      background-color: #273548;
    }

    nav a.active { 
      color: white; 
      background-color: var(--accent);
      border-color: var(--accent);
    }

    /* Conference Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Game Card Styling (Static & Non-clickable) */
    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      text-align: left;
    }

    .game-header-info { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 0.8rem; 
      color: var(--text-muted); 
      font-weight: 600; 
      text-transform: uppercase; 
      margin-bottom: 0.75rem; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-live { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
    .status-final { background-color: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    .status-sched { background-color: rgba(59, 130, 246, 0.2); color: #93c5fd; }

    .situation-text {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.75rem;
    }

    .team-line { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-weight: 700; 
      font-size: 1.05rem; 
      margin: 0.6rem 0; 
    }

    .team-details { display: flex; align-items: center; gap: 0.75rem; }
    .team-logo { width: 28px; height: 28px; object-fit: contain; }
    .team-rank { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-right: 0.2rem; }
    .team-score { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .winner { color: var(--gold); }

    .odds-line {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .loading-msg, .error-msg { color: var(--text-muted); padding: 2rem; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <h1 class="main-title">Week 0</h1>
    </header>

    <nav>
      <a href="testindex.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="testadmin.html">HOF</a>
      <a href="testscores.html" class="active">Scores</a>
    </nav>

    <!-- Optional Quick Filter for Major FBS Conferences -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterGames('all', event)">All FBS</button>
      <button class="filter-btn" onclick="filterGames('sec', event)">SEC</button>
      <button class="filter-btn" onclick="filterGames('big10', event)">Big Ten</button>
      <button class="filter-btn" onclick="filterGames('acc', event)">ACC</button>
      <button class="filter-btn" onclick="filterGames('big12', event)">Big 12</button>
    </div>

    <div id="scores-container">
      <div class="loading-msg">Fetching matchups through August 30...</div>
    </div>
  </div>

  <script>
    let rawEvents = [];
    let currentFilter = 'all';

    async function fetchScores(isBackgroundRefresh = false) {
      const container = document.getElementById('scores-container');
      const apiURL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300';

      try {
        // Only show the loading message on the initial load, not background polls
        if (!isBackgroundRefresh && rawEvents.length === 0) {
          container.innerHTML = '<div class="loading-msg">Fetching matchups through August 30...</div>';
        }

        const response = await fetch(apiURL);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          if (!isBackgroundRefresh) {
            container.innerHTML = '<div class="loading-msg">No games scheduled.</div>';
          }
          return;
        }

        // Define the August 30 cutoff date
        const cutoffDate = new Date('2026-08-30T23:59:59');

        // Filter events to only include games on or before August 30
        rawEvents = data.events.filter(event => {
          const gameDate = new Date(event.date);
          return gameDate <= cutoffDate;
        });

        if (rawEvents.length === 0) {
          if (!isBackgroundRefresh) {
            container.innerHTML = '<div class="loading-msg">No games scheduled through August 30.</div>';
          }
          return;
        }

        renderGames();

      } catch (err) {
        console.error('Error loading scores:', err);
        // Only show error message if we don't already have rendered games
        if (rawEvents.length === 0) {
          container.innerHTML = '<div class="error-msg">Could not load live FBS scores. Please try again later.</div>';
        }
      }
    }

    function filterGames(conf, clickEvent) {
      currentFilter = conf;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (clickEvent && clickEvent.target) {
        clickEvent.target.classList.add('active');
      }
      renderGames();
    }

    function renderGames() {
      const container = document.getElementById('scores-container');
      
      let filteredEvents = rawEvents;

      // Group/Conference Filtering Logic
      if (currentFilter !== 'all') {
        filteredEvents = rawEvents.filter(event => {
          const comp = event.competitions[0];
          const homeConf = comp.competitors[0]?.team?.conferenceId;
          const awayConf = comp.competitors[1]?.team?.conferenceId;

          if (currentFilter === 'sec') return homeConf === '8' || awayConf === '8';
          if (currentFilter === 'big10') return homeConf === '5' || awayConf === '5';
          if (currentFilter === 'acc') return homeConf === '1' || awayConf === '1';
          if (currentFilter === 'big12') return homeConf === '4' || awayConf === '4';
          return true;
        });
      }

      if (filteredEvents.length === 0) {
        container.innerHTML = '<div class="loading-msg">No games found for this filter through August 30.</div>';
        return;
      }

      // Sort criteria: Live ('in') games first, then upcoming ('pre'), then finalized ('post') at the bottom
      filteredEvents.sort((a, b) => {
        const stateA = a.competitions[0].status.type.state;
        const stateB = b.competitions[0].status.type.state;

        const getPriority = (state) => {
          if (state === 'in') return 1;
          if (state === 'pre') return 2;
          if (state === 'post') return 3;
          return 4;
        };

        return getPriority(stateA) - getPriority(stateB);
      });

      // Build HTML string to update DOM cleanly all at once
      let html = '';

      filteredEvents.forEach(event => {
        const competition = event.competitions[0];
        const statusType = competition.status.type.state; // 'pre', 'in', 'post'
        const statusDetail = competition.status.type.detail; // e.g. "Final", "3rd 4:12"
        
        const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
        const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

        const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
        const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

        const homeName = homeTeam.team.shortDisplayName || homeTeam.team.name;
        const awayName = awayTeam.team.shortDisplayName || awayTeam.team.name;
        
        const homeLogo = homeTeam.team.logo || '';
        const awayLogo = awayTeam.team.logo || '';
        
        const homeScore = homeTeam.score || '0';
        const awayScore = awayTeam.score || '0';

        // Live Situational Data (Down & Distance, Ball on yard line)
        let situationHTML = '';
        if (statusType === 'in' && competition.situation) {
          const sit = competition.situation;
          if (sit.downText && sit.shortDisplayName) {
            situationHTML = `<span class="situation-text">🏈 ${sit.downText} &bull; ${sit.shortDisplayName}</span>`;
          }
        }

        // Broadcast info
        const broadcast = competition.broadcasts && competition.broadcasts.length > 0 
          ? competition.broadcasts[0].names.join(', ') 
          : '';

        // Odds Info
        const oddsObj = competition.odds && competition.odds.length > 0 ? competition.odds[0] : null;
        const spreadText = oddsObj?.details ? `Spread: ${oddsObj.details}` : '';
        const ouText = oddsObj?.overUnder ? `O/U: ${oddsObj.overUnder}` : '';

        // Status badge logic
        let badgeClass = 'status-sched';
        let statusLabel = statusDetail;
        if (statusType === 'in') {
          badgeClass = 'status-live';
          statusLabel = `LIVE • ${statusDetail}`;
        } else if (statusType === 'post') {
          badgeClass = 'status-final';
          statusLabel = 'FINAL';
        }

        const isHomeWinner = statusType === 'post' && parseInt(homeScore) > parseInt(awayScore);
        const isAwayWinner = statusType === 'post' && parseInt(awayScore) > parseInt(homeScore);

        html += `
          <div class="game-card">
            <div class="game-header-info">
              <span class="status-badge ${badgeClass}">${statusLabel}</span>
              ${situationHTML}
              <span>${broadcast ? `📺 ${broadcast}` : ''}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${isAwayWinner ? 'winner' : ''}"><span class="team-rank">${awayRank}</span>${awayName}</span>
              </div>
              <span class="team-score ${isAwayWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : awayScore}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${isHomeWinner ? 'winner' : ''}"><span class="team-rank">${homeRank}</span>${homeName}</span>
              </div>
              <span class="team-score ${isHomeWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : homeScore}</span>
            </div>
            ${(spreadText || ouText) ? `
              <div class="odds-line">
                <span>${spreadText}</span>
                <span>${ouText}</span>
              </div>
            ` : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Initial load
    fetchScores(false);

    // Auto-refresh every 10 seconds in the background
    setInterval(() => {
      fetchScores(true);
    }, 10000);
  </script>
</body>
</html>

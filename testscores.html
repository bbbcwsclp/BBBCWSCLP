<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — FBS Scores</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e10;
      --card-bg: #14191d;
      --card-inner: #060a0c;
      --text: #eef2f2;
      --text-muted: #7c8a90;
      --border: #223038;

      --success: #34d67a;
      --danger: #ff4d4d;
      --warning: #4fb8ff;

      --accent: #ffb020;
      --gold: #ffb020;

      --font-display: 'Anton', 'Arial Narrow', sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', monospace;
      --font-label: 'Barlow Condensed', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-label);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255, 176, 32, 0.05), transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(20, 25, 29, 0.9), var(--bg) 70%),
        linear-gradient(rgba(34, 48, 56, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 48, 56, 0.18) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      background-position: center top, center top, center top, center top;
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1.main-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1;
    }

    /* Navigation Bar — broadcast channel tabs */
    nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    nav a {
      font-family: var(--font-label);
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      background-color: transparent;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px 4px 0 0;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--text);
      border-bottom-color: var(--accent);
      background-color: rgba(255, 176, 32, 0.06);
    }

    nav a.active {
      color: var(--accent);
      background-color: rgba(255, 176, 32, 0.08);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
    }

    nav a:focus-visible, .filter-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Conference Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-family: var(--font-label);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* Game Card Styling (Static & Non-clickable) */
    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
      text-align: left;
    }

    .game-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .status-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .status-live { background-color: rgba(52, 214, 122, 0.15); color: var(--success); border: 1px solid rgba(52, 214, 122, 0.3); }
    .status-live::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--success);
      animation: status-pulse 1.4s ease-in-out infinite;
    }
    .status-final { background-color: rgba(124, 138, 144, 0.15); color: var(--text-muted); border: 1px solid var(--border); }
    .status-sched { background-color: rgba(79, 184, 255, 0.15); color: var(--warning); border: 1px solid rgba(79, 184, 255, 0.3); }

    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-live::before { animation: none; }
    }

    .situation-text {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.72rem;
    }

    .team-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-label);
      font-weight: 700;
      font-size: 1.05rem;
      margin: 0.6rem 0;
    }

    .team-details { display: flex; align-items: center; gap: 0.75rem; }
    .team-logo { width: 28px; height: 28px; object-fit: contain; }
    .team-rank { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); font-weight: 700; margin-right: 0.2rem; }
    .team-score {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      min-width: 2.2rem;
      text-align: center;
    }
    .winner { color: var(--accent); }
    .winner.team-score { border-color: rgba(255, 176, 32, 0.4); }

    .odds-line {
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .loading-msg, .error-msg { color: var(--text-muted); padding: 2rem; font-size: 0.95rem; }
    .error-msg { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <div class="eyebrow">Live Scoreboard</div>
      <h1 class="main-title">Scores</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html" class="active">Scores</a>
    </nav>

    <!-- Optional Quick Filter for Major FBS Conferences -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterGames('all', event)">All FBS</button>
      <button class="filter-btn" onclick="filterGames('sec', event)">SEC</button>
      <button class="filter-btn" onclick="filterGames('big10', event)">Big Ten</button>
      <button class="filter-btn" onclick="filterGames('acc', event)">ACC</button>
      <button class="filter-btn" onclick="filterGames('big12', event)">Big 12</button>
    </div>

    <div id="scores-container">
      <div class="loading-msg">Fetching matchups...</div>
    </div>
  </div>

  <script>
    let rawEvents = [];
    let currentFilter = 'all';

    async function fetchScores(isBackgroundRefresh = false) {
      const container = document.getElementById('scores-container');
      const apiURL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300';

      try {
        // Only show the loading message on the initial load, not background polls
        if (!isBackgroundRefresh && rawEvents.length === 0) {
          container.innerHTML = '<div class="loading-msg">Fetching matchups...</div>';
        }

        const response = await fetch(apiURL);
        const data = await response.json();

        if (!data.events || data.events.length === 0) {
          if (!isBackgroundRefresh) {
            container.innerHTML = '<div class="loading-msg">No games scheduled.</div>';
          }
          return;
        }

        // No artificial date cutoff here — the ESPN scoreboard endpoint
        // already returns the current week's slate on its own (same as the
        // other pages on this site that hit this endpoint), so we just take
        // whatever it gives us instead of hardcoding a window that expires.
        rawEvents = data.events;

        renderGames();

      } catch (err) {
        console.error('Error loading scores:', err);
        // Only show error message if we don't already have rendered games
        if (rawEvents.length === 0) {
          container.innerHTML = '<div class="error-msg">Could not load live FBS scores. Please try again later.</div>';
        }
      }
    }

    function filterGames(conf, clickEvent) {
      currentFilter = conf;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (clickEvent && clickEvent.target) {
        clickEvent.target.classList.add('active');
      }
      renderGames();
    }

    function renderGames() {
      const container = document.getElementById('scores-container');

      let filteredEvents = rawEvents;

      // Group/Conference Filtering Logic
      if (currentFilter !== 'all') {
        filteredEvents = rawEvents.filter(event => {
          const comp = event.competitions[0];
          const homeConf = comp.competitors[0]?.team?.conferenceId;
          const awayConf = comp.competitors[1]?.team?.conferenceId;

          if (currentFilter === 'sec') return homeConf === '8' || awayConf === '8';
          if (currentFilter === 'big10') return homeConf === '5' || awayConf === '5';
          if (currentFilter === 'acc') return homeConf === '1' || awayConf === '1';
          if (currentFilter === 'big12') return homeConf === '4' || awayConf === '4';
          return true;
        });
      }

      if (filteredEvents.length === 0) {
        container.innerHTML = '<div class="loading-msg">No games found for this filter.</div>';
        return;
      }

      // Sort criteria: Live ('in') games first, then upcoming ('pre'), then finalized ('post') at the bottom
      filteredEvents.sort((a, b) => {
        const stateA = a.competitions[0].status.type.state;
        const stateB = b.competitions[0].status.type.state;

        const getPriority = (state) => {
          if (state === 'in') return 1;
          if (state === 'pre') return 2;
          if (state === 'post') return 3;
          return 4;
        };

        return getPriority(stateA) - getPriority(stateB);
      });

      // Build HTML string to update DOM cleanly all at once
      let html = '';

      filteredEvents.forEach(event => {
        const competition = event.competitions[0];
        const statusType = competition.status.type.state; // 'pre', 'in', 'post'
        const statusDetail = competition.status.type.detail; // e.g. "Final", "3rd 4:12"

        const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
        const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

        const homeRank = homeTeam.curatedRank?.current <= 25 ? `#${homeTeam.curatedRank.current} ` : '';
        const awayRank = awayTeam.curatedRank?.current <= 25 ? `#${awayTeam.curatedRank.current} ` : '';

        const homeName = homeTeam.team.shortDisplayName || homeTeam.team.name;
        const awayName = awayTeam.team.shortDisplayName || awayTeam.team.name;

        const homeLogo = homeTeam.team.logo || '';
        const awayLogo = awayTeam.team.logo || '';

        const homeScore = homeTeam.score || '0';
        const awayScore = awayTeam.score || '0';

        // Live Situational Data (Down & Distance, Ball on yard line)
        let situationHTML = '';
        if (statusType === 'in' && competition.situation) {
          const sit = competition.situation;
          if (sit.downText && sit.shortDisplayName) {
            situationHTML = `<span class="situation-text">🏈 ${sit.downText} &bull; ${sit.shortDisplayName}</span>`;
          }
        }

        // Broadcast info
        const broadcast = competition.broadcasts && competition.broadcasts.length > 0
          ? competition.broadcasts[0].names.join(', ')
          : '';

        // Odds Info
        const oddsObj = competition.odds && competition.odds.length > 0 ? competition.odds[0] : null;
        const spreadText = oddsObj?.details ? `Spread: ${oddsObj.details}` : '';
        const ouText = oddsObj?.overUnder ? `O/U: ${oddsObj.overUnder}` : '';

        // Status badge logic
        let badgeClass = 'status-sched';
        let statusLabel = statusDetail;
        if (statusType === 'in') {
          badgeClass = 'status-live';
          statusLabel = `LIVE • ${statusDetail}`;
        } else if (statusType === 'post') {
          badgeClass = 'status-final';
          statusLabel = 'FINAL';
        }

        const isHomeWinner = statusType === 'post' && parseInt(homeScore, 10) > parseInt(awayScore, 10);
        const isAwayWinner = statusType === 'post' && parseInt(awayScore, 10) > parseInt(homeScore, 10);

        html += `
          <div class="game-card">
            <div class="game-header-info">
              <span class="status-badge ${badgeClass}">${statusLabel}</span>
              ${situationHTML}
              <span>${broadcast ? `📺 ${broadcast}` : ''}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${awayLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${isAwayWinner ? 'winner' : ''}"><span class="team-rank">${awayRank}</span>${awayName}</span>
              </div>
              <span class="team-score ${isAwayWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : awayScore}</span>
            </div>
            <div class="team-line">
              <div class="team-details">
                <img src="${homeLogo}" class="team-logo" onerror="this.style.display='none'">
                <span class="${isHomeWinner ? 'winner' : ''}"><span class="team-rank">${homeRank}</span>${homeName}</span>
              </div>
              <span class="team-score ${isHomeWinner ? 'winner' : ''}">${statusType === 'pre' ? '-' : homeScore}</span>
            </div>
            ${(spreadText || ouText) ? `
              <div class="odds-line">
                <span>${spreadText}</span>
                <span>${ouText}</span>
              </div>
            ` : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Initial load
    fetchScores(false);

    // Auto-refresh every 10 seconds in the background
    setInterval(() => {
      fetchScores(true);
    }, 10000);
  </script>
</body>
</html>

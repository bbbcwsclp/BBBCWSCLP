<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBBCWSCLP — Standings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Favicon / Browser Tab Icon -->
  <link rel="icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG" type="image/png">

  <!-- Apple Touch Icon (For iPhone Home Screen Bookmarks) -->
  <link rel="apple-touch-icon" href="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">

  <!-- Open Graph / Social Sharing Meta Tags -->
  <meta property="og:title" content="BBBCWSCLP — Season Leaderboard & Standings">
  <meta property="og:description" content="Official standings and leaderboard for Big Boys Betting Club.">
  <meta property="og:image" content="https://gutmpjminpqhtwtilbzx.supabase.co/storage/v1/object/public/logos/logo.PNG">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0e10;
      --card-bg: #14191d;
      --card-inner: #060a0c;
      --text: #eef2f2;
      --text-muted: #7c8a90;
      --border: #223038;

      --success: #34d67a;
      --danger: #ff6b6b;
      --warning: #4fb8ff;

      --accent: #ffb020;
      --gold: #ffb020;

      --font-display: 'Anton', 'Arial Narrow', sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', monospace;
      --font-label: 'Barlow Condensed', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-label);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(255, 176, 32, 0.05), transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(20, 25, 29, 0.9), var(--bg) 70%),
        linear-gradient(rgba(34, 48, 56, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 48, 56, 0.18) 1px, transparent 1px);
      background-size: auto, auto, 56px 56px, 56px 56px;
      background-position: center top, center top, center top, center top;
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem 4rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 650px; margin: 0 auto; text-align: center; }

    header { margin-bottom: 1rem; width: 100%; }
    header img { max-height: 90px; margin-bottom: 0.75rem; object-fit: contain; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1.main-title {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
      color: var(--text);
      line-height: 1;
    }

    /* Navigation Bar — broadcast channel tabs */
    nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 2rem;
      width: 100%;
    }

    nav a {
      font-family: var(--font-label);
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      background-color: transparent;
      border: 1px solid var(--border);
      border-bottom: 2px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 4px 4px 0 0;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    nav a:hover {
      color: var(--text);
      border-bottom-color: var(--accent);
      background-color: rgba(255, 176, 32, 0.06);
    }

    nav a.active {
      color: var(--accent);
      background-color: rgba(255, 176, 32, 0.08);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
    }

    nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Card styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 12px -2px rgba(0,0,0,0.4);
      margin-bottom: 2rem;
      text-align: center;
      overflow: hidden;
    }

    .card h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 1rem 1.5rem;
      background: var(--card-inner);
      border-bottom: 2px solid var(--accent);
      text-align: center;
    }

    .table-container {
      padding: 0 0.5rem 0.5rem 0.5rem;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.95rem; }

    th, td {
      text-align: center;
      padding: 0.9rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td { font-family: var(--font-label); }

    /* Zebra striping so long lists are easier to scan */
    tbody tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Interactive row hover & smooth transitions */
    tr {
      transition: background-color 0.2s ease;
    }
    tbody tr:hover {
      background-color: rgba(255, 176, 32, 0.05);
    }

    /* Player initials styling */
    td:nth-child(2) {
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    /* Tabular numeric alignment for stats */
    td:nth-child(1) {
      font-family: var(--font-mono);
      color: var(--text-muted);
    }
    td:nth-child(3), td:nth-child(4) {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .rank-1 { font-weight: bold; }
    .rank-2 { font-weight: bold; }
    .rank-3 { font-weight: bold; }

    /* Colored text styling for top 3 player names */
    .name-rank-1 { color: var(--accent); font-weight: bold; }
    .name-rank-2 { color: #cbd5e1; font-weight: bold; }
    .name-rank-3 { color: #d98757; font-weight: bold; }

    .msg { text-align: center; color: var(--text-muted); padding: 1.5rem; font-style: italic; font-family: var(--font-label); }

    /* Skeleton Loading State */
    .skeleton-row td { padding: 0.7rem 0.75rem; }
    .skeleton-bar {
      height: 14px;
      border-radius: 4px;
      margin: 0 auto;
      background: linear-gradient(90deg, var(--card-inner) 25%, rgba(255,255,255,0.07) 50%, var(--card-inner) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Podium */
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.6rem;
      padding: 1.5rem 1rem 0.5rem 1rem;
    }
    .podium-spot {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 33%;
      max-width: 150px;
    }
    .podium-spot-1 { order: 2; }
    .podium-spot-2 { order: 1; }
    .podium-spot-3 { order: 3; }

    .podium-medal { font-size: 1.6rem; margin-bottom: 0.35rem; }
    .podium-spot-1 .podium-medal { font-size: 2rem; }

    .podium-name {
      font-family: var(--font-label);
      font-weight: 800;
      font-size: 1rem;
      color: var(--text);
      letter-spacing: 0.3px;
      margin-bottom: 0.15rem;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    .podium-spot-1 .podium-name { color: var(--accent); font-size: 1.15rem; }
    .podium-spot-2 .podium-name { color: #cbd5e1; }
    .podium-spot-3 .podium-name { color: #d98757; }

    .podium-record {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .podium-pct {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .podium-base {
      width: 100%;
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 0.4rem;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--card-bg);
    }
    .podium-base-1 { height: 74px; background: linear-gradient(180deg, #ffd54f, var(--accent)); box-shadow: 0 0 16px rgba(255, 176, 32, 0.3); }
    .podium-base-2 { height: 52px; background: linear-gradient(180deg, #e2e8f0, #b6c0c9); }
    .podium-base-3 { height: 38px; background: linear-gradient(180deg, #e3a76f, #b97a45); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img src="logo.PNG" alt="BBBC Logo" onerror="this.style.display='none'">
      <div class="eyebrow">All-Time Standings</div>
      <h1 class="main-title">Leaderboard</h1>
    </header>

    <nav>
      <a href="index.html">Weekly</a>
      <a href="standings.html" class="active">Standings</a>
      <a href="season.html">Season</a>
      <a href="halloffame.html">HOF</a>
      <a href="scores.html">Scores</a>
    </nav>

    <div id="podium-container"></div>

    <div class="card">
      <h2>Overall Leaderboard</h2>
      <div class="table-container" style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>(W-L-D)</th>
              <th>Win %</th>
            </tr>
          </thead>
          <tbody id="standings-tbody">
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width: 24px;"></div></td><td><div class="skeleton-bar" style="width: 40px;"></div></td><td><div class="skeleton-bar" style="width: 60px;"></div></td><td><div class="skeleton-bar" style="width: 44px;"></div></td></tr>
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width: 24px;"></div></td><td><div class="skeleton-bar" style="width: 40px;"></div></td><td><div class="skeleton-bar" style="width: 60px;"></div></td><td><div class="skeleton-bar" style="width: 44px;"></div></td></tr>
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width: 24px;"></div></td><td><div class="skeleton-bar" style="width: 40px;"></div></td><td><div class="skeleton-bar" style="width: 60px;"></div></td><td><div class="skeleton-bar" style="width: 44px;"></div></td></tr>
            <tr class="skeleton-row"><td><div class="skeleton-bar" style="width: 24px;"></div></td><td><div class="skeleton-bar" style="width: 40px;"></div></td><td><div class="skeleton-bar" style="width: 60px;"></div></td><td><div class="skeleton-bar" style="width: 44px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gutmpjminpqhtwtilbzx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dG1wam1pbnBxaHR3dGlsYnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjgzNzYsImV4cCI6MjEwMzAwNDM3Nn0.wcK0JX-Ze-UyN_-zwAtbYsLz15-xVB1fj3YtJV0y4jI';

    const { createClient } = window.supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Standard competition ranking (1224-style): players who are fully tied
    // on totalPoints, wins, AND winPct share the same rank/medal instead of
    // one arbitrarily outranking the other. Shared by both the podium and
    // the full table so they never disagree on who's "1st."
    function buildRankedEntries(leaderboard) {
      let currentRank = 0;
      let previous = null;

      return leaderboard.map((p, index) => {
        const isTie = previous
          && p.totalPoints === previous.totalPoints
          && p.wins === previous.wins
          && p.winPct === previous.winPct;

        if (!isTie) currentRank = index + 1;
        const rank = currentRank;
        previous = p;

        let rankDisplay = `#${rank}`;
        let rankClass = '';
        let nameClass = '';

        if (rank === 1) {
          rankDisplay = '🥇';
          rankClass = 'rank-1';
          nameClass = 'name-rank-1';
        } else if (rank === 2) {
          rankDisplay = '🥈';
          rankClass = 'rank-2';
          nameClass = 'name-rank-2';
        } else if (rank === 3) {
          rankDisplay = '🥉';
          rankClass = 'rank-3';
          nameClass = 'name-rank-3';
        }

        // Hidden admin link: only for the player whose initials are EXACTLY
        // "DS" (case-insensitive), not a substring match, so no other
        // player's initials can accidentally pick up a hidden link.
        let formattedInitials = p.initials;
        if (p.initials.toUpperCase() === 'DS') {
          formattedInitials = `<a href="admin.html" style="color: inherit; text-decoration: none;">${p.initials}</a>`;
        }

        let pctColor = 'var(--text-muted)';
        if (p.wins > p.losses) {
          pctColor = 'var(--success)';
        } else if (p.losses > p.wins) {
          pctColor = 'var(--danger)';
        }

        return { ...p, rank, rankDisplay, rankClass, nameClass, formattedInitials, pctColor };
      });
    }

    function renderPodium(rankedEntries) {
      const podiumContainer = document.getElementById('podium-container');
      if (!podiumContainer) return;

      // Group by rank rather than by array position, since ties mean more
      // than 3 people can occupy ranks 1-3 (or fewer than 3 distinct spots
      // exist at all with a small roster).
      const byRank = { 1: [], 2: [], 3: [] };
      for (const entry of rankedEntries) {
        if (entry.rank >= 1 && entry.rank <= 3) byRank[entry.rank].push(entry);
        if (entry.rank > 3) break;
      }

      if (byRank[1].length === 0) {
        podiumContainer.innerHTML = '';
        return;
      }

      const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };

      const renderSpot = (rank) => {
        const group = byRank[rank];
        if (!group || group.length === 0) return '';

        const names = group.map(p => p.formattedInitials).join(' / ');
        // When tied, stats can differ slightly (e.g. different W-L split
        // producing the same win%); show the first tied player's line as
        // representative rather than trying to merge differing records.
        const rep = group[0];

        return `
          <div class="podium-spot podium-spot-${rank}">
            <div class="podium-medal">${medals[rank]}</div>
            <div class="podium-name">${names}</div>
            <div class="podium-record">${rep.wins}-${rep.losses}-${rep.draws}</div>
            <div class="podium-pct" style="color: ${rep.pctColor};">${(rep.winPct * 100).toFixed(1)}%</div>
            <div class="podium-base podium-base-${rank}">${rank === 1 ? '1ST' : rank === 2 ? '2ND' : '3RD'}</div>
          </div>
        `;
      };

      podiumContainer.innerHTML = `
        <div class="podium">
          ${renderSpot(1)}
          ${renderSpot(2)}
          ${renderSpot(3)}
        </div>
      `;
    }

    async function loadStandings() {
      const tbody = document.getElementById('standings-tbody');

      const { data: playersData, error: playerErr } = await _supabase
        .from('players')
        .select('*');

      const { data: picksData, error: pickErr } = await _supabase
        .from('picks')
        .select('*');

      if (playerErr || pickErr) {
        tbody.innerHTML = `<tr><td colspan="4" class="msg" style="color: var(--danger);">Error loading standings data.</td></tr>`;
        return;
      }

      // Guard against Supabase ever returning null data without an error —
      // previously this would throw on .forEach and leave the page stuck
      // on "Calculating standings...".
      const players = playersData || [];
      const picks = picksData || [];

      const stats = {};
      players.forEach(p => {
        stats[p.id] = {
          id: p.id,
          initials: p.initials,
          wins: 0,
          losses: 0,
          draws: 0
        };
      });

      picks.forEach(p => {
        if (!stats[p.player_id]) return;
        if (p.result === 'W') {
          stats[p.player_id].wins += 1;
        } else if (p.result === 'L') {
          stats[p.player_id].losses += 1;
        } else if (p.result === 'D') {
          stats[p.player_id].draws += 1;
        }
      });

      const leaderboard = Object.values(stats).map(s => {
        const totalPoints = s.wins + (s.draws * 0.5);
        const totalDecided = s.wins + s.losses + s.draws;
        const winPct = totalDecided > 0 ? (totalPoints / totalDecided) : 0;
        return {
          ...s,
          totalPoints,
          winPct
        };
      });

      leaderboard.sort((a, b) => {
        if (b.totalPoints !== a.totalPoints) {
          return b.totalPoints - a.totalPoints;
        }
        if (b.wins !== a.wins) {
          return b.wins - a.wins;
        }
        return b.winPct - a.winPct;
      });

      tbody.innerHTML = '';

      if (leaderboard.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="msg">No players registered yet.</td></tr>`;
        return;
      }

      // Standard competition ranking (1224-style): players who are fully
      // tied on totalPoints, wins, AND winPct share the same rank/medal
      // instead of the earlier one arbitrarily outranking the other.
      let currentRank = 0;
      let previous = null;

      leaderboard.forEach((p, index) => {
        const isTie = previous
          && p.totalPoints === previous.totalPoints
          && p.wins === previous.wins
          && p.winPct === previous.winPct;

        if (!isTie) currentRank = index + 1;
        const rank = currentRank;
        previous = p;

        let rankDisplay = `#${rank}`;
        let rankClass = '';
        let nameClass = '';

        if (rank === 1) {
          rankDisplay = '🥇';
          rankClass = 'rank-1';
          nameClass = 'name-rank-1';
        } else if (rank === 2) {
          rankDisplay = '🥈';
          rankClass = 'rank-2';
          nameClass = 'name-rank-2';
        } else if (rank === 3) {
          rankDisplay = '🥉';
          rankClass = 'rank-3';
          nameClass = 'name-rank-3';
        }

        // Hidden admin link: only for the player whose initials are EXACTLY
        // "DS" (case-insensitive). Previously this did a substring search
        // across every player's initials, so anyone whose initials merely
        // contained "ds" (e.g. "ADS") would have accidentally picked up a
        // hidden, invisible link to admin.html. An exact match removes that
        // risk entirely.
        let formattedInitials = p.initials;
        if (p.initials.toUpperCase() === 'DS') {
          formattedInitials = `<a href="admin.html" style="color: inherit; text-decoration: none;">${p.initials}</a>`;
        }

        // Dynamic Win % Color Logic (Green if wins > losses, Red if losses > wins, muted default if even)
        let pctColor = 'var(--text-muted)';
        if (p.wins > p.losses) {
          pctColor = 'var(--success)';
        } else if (p.losses > p.wins) {
          pctColor = 'var(--danger)';
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="${rankClass}">${rankDisplay}</td>
          <td><strong class="${nameClass}">${formattedInitials}</strong></td>
          <td>${p.wins}-${p.losses}-${p.draws}</td>
          <td style="color: ${pctColor}; font-weight: 700;">${(p.winPct * 100).toFixed(1)}%</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadStandings();
  </script>
</body>
</html>
